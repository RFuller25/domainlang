<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain documentation</title>
<meta name="description" content="Domain is a pipeline language for Advent of Code: you describe what needs to happen, and the compiler decides how to do it optimally. Reference, tutorial, 32 runnable programs, and a browser playground.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Domain documentation">
<meta property="og:site_name" content="Domain">
<meta property="og:description" content="A pipeline language for Advent of Code — you describe what, the compiler decides how. Reference, tutorial, 32 runnable programs, and a browser playground.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c3aed'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<style>
  /* ---- Design tokens ----
     One scale for space (4px steps), one for type, and colour tokens for both
     themes. Every text/background pair here clears WCAG AA (4.5:1) in its
     theme; the per-page technique colour (--jjk-c) is only ever used for
     rules, borders and glows, or mixed toward --text before it carries words. */
  :root {
    --bg: #ffffff;
    --bg-alt: #f6f7f9;
    --bg-code: #f5f6f8;
    --bg-code-head: #eceef2;
    --sidebar-bg: #fafbfc;
    --text: #1a1d26;
    --text-muted: #545d6c;
    --border: #e2e5ea;
    --border-strong: #cdd2da;
    --accent: #6d28d9;
    --accent-soft: #f1ebfd;
    --accent-text: #5b21b6;
    --on-accent: #ffffff;
    --mark: #fde68a;
    --mark-text: #3a2f00;
    --ok: #15803d;
    --err: #b91c1c;
    --err-soft: #fef2f2;
    --warn: #b45309;
    --focus: #6d28d9;
    --shadow: 0 1px 2px rgba(20, 22, 40, 0.06), 0 8px 28px rgba(20, 22, 40, 0.10);
    --radius: 10px;
    --header-h: 56px;
    --measure: 46rem;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --tok-arg: #0e7490; --tok-str: #a14a07; --tok-num: #9d1aab; --tok-def: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101218; --bg-alt: #171a22; --bg-code: #161921; --bg-code-head: #1c2029;
      --sidebar-bg: #12141b; --text: #e4e7ed; --text-muted: #a0a8b6;
      --border: #272b36; --border-strong: #363b48;
      --accent: #a78bfa; --accent-soft: #241f3a; --accent-text: #c4b5fd; --on-accent: #16101f;
      --mark: #6b5a12; --mark-text: #fdf3c8;
      --ok: #4ade80; --err: #fca5a5; --err-soft: #2a1618; --warn: #fcd34d; --focus: #c4b5fd;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.45);
      --tok-arg: #67e8f9; --tok-str: #fcd34d; --tok-num: #f0abfc; --tok-def: #86efac;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101218; --bg-alt: #171a22; --bg-code: #161921; --bg-code-head: #1c2029;
    --sidebar-bg: #12141b; --text: #e4e7ed; --text-muted: #a0a8b6;
    --border: #272b36; --border-strong: #363b48;
    --accent: #a78bfa; --accent-soft: #241f3a; --accent-text: #c4b5fd; --on-accent: #16101f;
    --mark: #6b5a12; --mark-text: #fdf3c8;
    --ok: #4ade80; --err: #fca5a5; --err-soft: #2a1618; --warn: #fcd34d; --focus: #c4b5fd;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.45);
    --tok-arg: #67e8f9; --tok-str: #fcd34d; --tok-num: #f0abfc; --tok-def: #86efac;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-padding-top: calc(var(--header-h) + 16px); -webkit-text-size-adjust: 100%; }
  body {
    font: 16px/1.65 var(--sans); color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a { color: var(--accent-text); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  /* One focus ring everywhere, shown for keyboard users only. */
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  button { font-family: inherit; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .skip-link {
    position: fixed; left: 12px; top: -60px; z-index: 200; padding: 10px 16px;
    background: var(--accent); color: var(--on-accent); border-radius: 8px; font-weight: 600;
  }
  .skip-link:focus { top: 10px; text-decoration: none; }

  /* ---- Header ---- */
  .topbar {
    position: sticky; top: 0; z-index: 70; height: var(--header-h);
    display: flex; align-items: center; gap: 12px; padding: 0 16px 0 20px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--text); flex: none; margin-right: auto; }
  .brand:hover { text-decoration: none; }
  .brand .logo { width: 26px; height: 26px; flex: none; }
  .brand-name { font-size: 1.08rem; font-weight: 750; letter-spacing: -0.02em; }
  .brand .badge {
    font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--accent-text); background: var(--accent-soft);
    padding: 2px 7px; border-radius: 20px; font-weight: 650;
  }
  .search-trigger {
    display: flex; align-items: center; gap: 8px; width: min(340px, 40vw); height: 36px;
    padding: 0 8px 0 11px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--bg-alt); color: var(--text-muted); font-size: 0.88rem; cursor: pointer; text-align: left;
  }
  .search-trigger:hover { border-color: var(--border-strong); color: var(--text); }
  .search-trigger .st-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  kbd, .kbd {
    font: 500 0.7rem/1.5 var(--mono); color: var(--text-muted); background: var(--bg);
    border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px;
  }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 36px; height: 36px; padding: 0; border-radius: 9px; cursor: pointer;
    color: var(--text-muted); background: transparent; border: 1px solid transparent;
  }
  .icon-btn:hover { color: var(--text); background: var(--bg-alt); border-color: var(--border); text-decoration: none; }
  #theme-toggle .i-sun { display: none; }
  :root[data-theme="dark"] #theme-toggle .i-sun { display: block; }
  :root[data-theme="dark"] #theme-toggle .i-moon { display: none; }
  .menu-toggle { display: none; }

  .layout { display: flex; min-height: calc(100vh - var(--header-h)); }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 272px; flex: 0 0 272px; background: var(--sidebar-bg);
    border-right: 1px solid var(--border); padding: 18px 14px 40px;
    position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h));
    overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
  }
  .tagline { color: var(--text-muted); font-size: 0.82rem; line-height: 1.5; margin: 0 6px 14px; }
  nav.toc-nav { font-size: 0.9rem; }
  nav.toc-nav .group-label {
    text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.08em;
    color: var(--text-muted); font-weight: 700; margin: 20px 0 6px; padding-left: 10px;
  }
  nav.toc-nav .group-label:first-child { margin-top: 4px; }
  nav.toc-nav .nav-row { display: flex; align-items: stretch; }
  nav.toc-nav a.doc-link {
    flex: 1; min-width: 0; display: block; padding: 6px 10px; border-radius: 7px; color: var(--text);
    margin-bottom: 1px; line-height: 1.35; border-left: 2px solid transparent;
  }
  nav.toc-nav a.doc-link:hover { background: var(--bg-alt); text-decoration: none; }
  nav.toc-nav a.doc-link.active {
    background: color-mix(in srgb, var(--jjk-c, var(--accent)) 12%, var(--accent-soft));
    /* The per-page colour is picked to theme the page, not to sit on the pale
       tint behind it; mixing it toward the body text keeps the active entry
       legible (>= 4.5:1) whichever technique colour the page carries. The
       2px rule beside it keeps the undiluted colour. */
    color: color-mix(in srgb, var(--jjk-c, var(--accent-text)) 35%, var(--text));
    font-weight: 600; border-left-color: var(--jjk-c, var(--accent));
  }
  nav.toc-nav .doc-link .desc {
    display: block; font-size: 0.74rem; color: var(--text-muted); font-weight: 400; margin-top: 1px;
  }
  nav.toc-nav a.doc-link.active .desc { color: color-mix(in srgb, var(--accent-text) 55%, var(--text)); }
  nav.toc-nav .nav-children { margin: 0 0 4px 14px; padding-left: 6px; border-left: 1px solid var(--border); }
  nav.toc-nav .nav-children a.doc-link { font-size: 0.86rem; padding: 4px 10px; }
  nav.toc-nav .nav-children[hidden] { display: none; }
  nav.toc-nav .nav-twisty {
    flex: none; width: 30px; margin-left: 2px; border: none; background: none; border-radius: 7px;
    color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  nav.toc-nav .nav-twisty:hover { background: var(--bg-alt); color: var(--text); }
  nav.toc-nav .nav-twisty svg { width: 15px; height: 15px; transition: transform 0.15s ease; }
  nav.toc-nav .nav-twisty[aria-expanded="true"] svg { transform: rotate(90deg); }

  /* ---- Main column ---- */
  .main-wrap { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; }
  main { max-width: calc(var(--measure) + 96px); width: 100%; padding: 28px 48px 120px; }
  #content:focus { outline: none; }
  .crumbs { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 14px; }
  .crumbs:empty { display: none; }
  .crumbs ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
  .crumbs li + li::before { content: "/"; margin-right: 4px; color: var(--border-strong); }
  .crumbs a { color: var(--text-muted); }
  .crumbs a:hover { color: var(--accent-text); }
  .crumbs [aria-current] { color: var(--text); font-weight: 550; }

  /* ---- Page TOC (right rail, and its collapsible twin on narrower screens) ---- */
  .page-toc {
    flex: 0 0 232px; padding: 32px 20px 40px 8px; position: sticky; top: var(--header-h);
    height: calc(100vh - var(--header-h)); overflow-y: auto; font-size: 0.82rem; scrollbar-width: thin;
  }
  .page-toc .label, .toc-mobile summary {
    text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.08em;
    color: var(--text-muted); font-weight: 700; margin-bottom: 10px;
  }
  .page-toc a, .toc-mobile a {
    display: block; color: var(--text-muted); padding: 3px 0 3px 12px; line-height: 1.4;
    border-left: 2px solid var(--border);
  }
  .page-toc a:hover, .toc-mobile a:hover { color: var(--text); text-decoration: none; }
  .page-toc a.h3, .toc-mobile a.h3 { padding-left: 24px; font-size: 0.78rem; }
  .page-toc a.active { color: var(--accent-text); border-left-color: var(--accent); font-weight: 600; }
  .page-toc .to-top { margin-top: 14px; border-left: none; padding-left: 0; font-size: 0.78rem; }
  .toc-mobile {
    display: none; margin: 0 0 1.4em; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-alt); font-size: 0.86rem;
  }
  .toc-mobile summary { cursor: pointer; margin: 0; padding: 10px 14px; list-style-position: inside; }
  .toc-mobile .toc-list { padding: 0 14px 12px; max-height: 50vh; overflow-y: auto; }
  .toc-mobile[hidden] { display: none !important; }

  @media (max-width: 1180px) {
    .page-toc { display: none; }
    .toc-mobile { display: block; }
  }
  @media (max-width: 860px) {
    .topbar { padding: 0 10px; gap: 6px; }
    .menu-toggle { display: inline-flex; }
    .search-trigger { width: 36px; padding: 0; justify-content: center; border-color: transparent; background: transparent; }
    .search-trigger .st-label, .search-trigger kbd { display: none; }
    .sidebar {
      position: fixed; z-index: 60; left: 0; top: var(--header-h); height: calc(100% - var(--header-h));
      width: min(300px, 86vw); transform: translateX(-102%); visibility: hidden;
      transition: transform 0.2s ease, visibility 0s linear 0.2s; box-shadow: var(--shadow);
    }
    .sidebar.open { transform: translateX(0); visibility: visible; transition: transform 0.2s ease; }
    main { padding: 18px 16px 96px; }
    .scrim { display: none; position: fixed; inset: var(--header-h) 0 0 0; background: rgba(5, 6, 12, 0.45); z-index: 55; }
    .scrim.show { display: block; }
  }
  @media (max-width: 420px) { .brand .badge { display: none; } }

  /* ---- Markdown content ---- */
  article { overflow-wrap: break-word; }
  article h1, article h2, article h3, article h4 {
    line-height: 1.25; letter-spacing: -0.015em; scroll-margin-top: calc(var(--header-h) + 16px);
    font-weight: 700; text-wrap: balance;
  }
  article h1 { font-size: clamp(1.85rem, 1.4rem + 1.6vw, 2.3rem); font-weight: 800; letter-spacing: -0.025em; margin: 0 0 0.55em; }
  article h2 {
    font-size: 1.5rem; margin: 2em 0 0.65em; padding-bottom: 0.3em;
    border-bottom: 1px solid var(--border);
    border-image: linear-gradient(90deg, var(--jjk-c, var(--accent)) 0 3em, var(--border) 3em) 1;
  }
  article h3 { font-size: 1.2rem; margin: 1.7em 0 0.55em; }
  article h4 { font-size: 1.02rem; margin: 1.4em 0 0.4em; }
  article h1 code, article h2 code, article h3 code, article h4 code { font-size: 0.66em; vertical-align: 0.1em; font-weight: 500; }
  article p { margin: 0 0 1.05em; }
  article ul, article ol { margin: 0 0 1.1em; padding-left: 1.4em; }
  article li { margin: 0.3em 0; }
  article li::marker { color: var(--text-muted); }
  article strong { font-weight: 650; }
  /* Blockquotes in these pages are asides and caveats: styled as a callout. */
  article blockquote {
    margin: 0 0 1.2em; padding: 0.75em 1.1em; border: 1px solid var(--border);
    border-left: 3px solid var(--jjk-c, var(--accent));
    background: var(--bg-alt); color: var(--text); border-radius: 0 var(--radius) var(--radius) 0;
  }
  article blockquote p:last-child { margin-bottom: 0; }
  article code {
    font-family: var(--mono); font-size: 0.86em; background: var(--bg-code);
    padding: 0.12em 0.38em; border-radius: 5px;
    /* A chip long enough to wrap gets a complete box on each fragment, and one
       with no space in it must still be breakable (match-pattern.md quotes a
       long unbroken one), or it pushes the page sideways on a phone. */
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
    overflow-wrap: break-word;
    border: 1px solid color-mix(in srgb, var(--jjk-c, var(--accent)) 22%, var(--border));
  }
  article a code { color: inherit; }

  /* Code blocks. render.js puts the language tag and the buttons inside the
     <pre>; they are lifted into a header strip so they never cover code, and
     the <code> is the horizontal scroller so the strip stays put. */
  article pre {
    position: relative; margin: 0 0 1.25em; line-height: 1.55;
    background: var(--bg-code); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; overflow-x: auto;
  }
  article pre:has(> .copy-btn) { padding: 36px 0 0; overflow: hidden; }
  article pre:has(> .copy-btn)::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 36px;
    background: var(--bg-code-head); border-bottom: 1px solid var(--border);
  }
  article pre:has(> .copy-btn) > code { display: block; overflow-x: auto; padding: 12px 16px 14px; scrollbar-width: thin; }
  article pre code { background: none; border: none; padding: 0; font-size: 0.86em; border-radius: 0; }
  article pre .lang-tag {
    position: absolute; top: 0; left: 14px; line-height: 36px; font: 650 0.68rem/36px var(--sans);
    text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted);
  }
  article pre:not(:has(> .copy-btn)) .lang-tag { position: static; display: block; line-height: 1.4; margin-bottom: 8px; }
  article pre .copy-btn, article pre .run-btn, article pre .explain-btn {
    position: absolute; top: 5px; height: 26px; padding: 0 10px;
    font: 600 0.74rem/24px var(--sans); border-radius: 6px; cursor: pointer;
  }
  article pre .copy-btn { right: 6px; color: var(--text-muted); background: transparent; border: 1px solid transparent; }
  article pre .copy-btn:hover { color: var(--text); background: var(--bg); border-color: var(--border); }
  article pre .copy-btn.copied { color: var(--ok); }
  article pre .run-btn { right: 70px; }
  article pre .explain-btn { right: 126px; }
  /* Blocks that show a program's input or output read as its I/O, not code. */

  /* Domain syntax highlighting (see highlightDomain in render.js). These are
     the only colours in the article body, so they carry meaning. */
  .tok-kw      { color: var(--accent-text); font-weight: 600; }
  .tok-arg     { color: var(--tok-arg); }
  .tok-str     { color: var(--tok-str); }
  .tok-num     { color: var(--tok-num); }
  .tok-op      { color: var(--text-muted); }
  .tok-comment { color: var(--text-muted); font-style: italic; }
  .tok-def     { color: var(--tok-def); }

  /* A heading's stable short anchor: an empty target placed just above it. */
  article a.heading-alias { display: block; height: 0; scroll-margin-top: calc(var(--header-h) + 16px); }
  article a.heading-anchor {
    color: var(--text-muted); opacity: 0; margin-left: 0.35em; font-weight: 400;
    text-decoration: none; font-size: 0.75em; padding: 0 0.2em; border-radius: 4px;
    transition: opacity 0.12s ease;
  }
  article a.heading-anchor:hover { color: var(--accent-text); }
  article :is(h1, h2, h3, h4):hover .heading-anchor, article a.heading-anchor:focus-visible { opacity: 1; }
  @media (hover: none) { article :is(h2, h3) .heading-anchor { opacity: 0.35; } }

  .page-edit { margin: 3em 0 0; padding-top: 1.2em; border-top: 1px solid var(--border); }
  .page-edit a { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-muted); }
  .page-edit a:hover { color: var(--accent-text); }
  .page-edit svg.i { width: 15px; height: 15px; }

  article table {
    border-collapse: separate; border-spacing: 0; width: 100%; margin: 0 0 1.5em; font-size: 0.9rem;
    display: block; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius);
    line-height: 1.5;
  }
  article th, article td { border-bottom: 1px solid var(--border); padding: 9px 13px; text-align: left; vertical-align: top; }
  article th + th, article td + td { border-left: 1px solid var(--border); }
  article tbody tr:last-child td { border-bottom: none; }
  article th { background: var(--bg-alt); font-weight: 650; font-size: 0.84rem; white-space: nowrap; }
  article tbody tr:hover td { background: color-mix(in srgb, var(--accent) 4%, transparent); }
  article hr { border: none; border-top: 1px solid var(--border); margin: 2.4em 0; }
  article img { max-width: 100%; }
  mark { background: var(--mark); color: var(--mark-text); border-radius: 3px; padding: 0 2px; }

  .page-nav {
    display: flex; justify-content: space-between; gap: 12px; margin-top: 40px;
  }
  .page-nav a {
    flex: 1; padding: 14px 18px; border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; gap: 2px; min-width: 0;
  }
  .page-nav a:hover { border-color: var(--accent); text-decoration: none; background: var(--bg-alt); }
  .page-nav a.next { text-align: right; align-items: flex-end; }
  .page-nav .dir { font-size: 0.74rem; color: var(--text-muted); }
  .page-nav .ttl { font-weight: 650; color: var(--text); }
  @media (max-width: 520px) { .page-nav { flex-direction: column; } .page-nav > span:empty { display: none; } }

  /* ---- Search dialog ---- */
  .search-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(8, 10, 18, 0.5); padding: 10vh 16px 16px;
  }
  .search-overlay.open { display: block; }
  .search-panel {
    max-width: 660px; margin: 0 auto; background: var(--bg);
    border: 1px solid var(--border-strong); border-radius: 14px; overflow: hidden;
    box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--accent) 12%, transparent);
    display: flex; flex-direction: column; max-height: 80vh;
  }
  .search-panel .search-input-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 16px; border-bottom: 1px solid var(--border);
  }
  .search-panel .search-input-row > svg.i { color: var(--text-muted); }
  .search-panel input {
    flex: 1; min-width: 0; border: none; background: none; color: var(--text); font-size: 1.05rem;
    font-family: var(--sans); outline: none; padding: 4px 0;
  }
  .search-panel .close-btn { font: 500 0.72rem/1.5 var(--mono); cursor: pointer; }
  .search-results { flex: 1; overflow-y: auto; padding: 6px; overscroll-behavior: contain; }
  .search-results .empty { padding: 34px 20px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
  .result {
    display: block; padding: 10px 14px; border-radius: 9px; cursor: pointer; color: var(--text);
    border: 1px solid transparent;
  }
  .result:hover { background: var(--bg-alt); text-decoration: none; }
  .result.sel { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .result .r-doc { font-size: 0.72rem; color: var(--accent-text); font-weight: 600; }
  .result .r-title { font-weight: 600; margin: 1px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result .r-snippet { font-size: 0.83rem; color: var(--text-muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .result mark { font-weight: 600; }
  .search-foot {
    display: flex; gap: 16px; padding: 8px 16px; border-top: 1px solid var(--border);
    font-size: 0.74rem; color: var(--text-muted); background: var(--bg-alt);
  }
  @media (max-width: 600px) {
    .search-overlay { padding: 0; }
    .search-panel { max-width: none; height: 100%; max-height: none; border-radius: 0; border: none; }
    .search-foot { display: none; }
  }

  /* Present to screen readers, invisible on screen — the search dialog's own
     name, and the live regions that announce result counts and run status. */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .search-panel .scope-btn {
    flex: none; padding: 3px 10px; font: 600 0.72rem/1.5 var(--sans); cursor: pointer;
    color: var(--text-muted); background: var(--bg-alt); border: 1px solid var(--border);
    border-radius: 20px; max-width: 40vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .search-panel .scope-btn:hover { color: var(--accent-text); border-color: var(--accent); }
  .search-panel .scope-btn[aria-pressed="true"] {
    color: var(--accent-text); background: var(--accent-soft); border-color: var(--accent);
  }
  .search-recents { padding: 10px 12px 14px; }
  .search-recents .rec-label {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); font-weight: 700; margin-bottom: 8px;
  }
  .search-recents button {
    font: 500 0.84rem/1.5 var(--sans); color: var(--text); background: var(--bg-alt);
    border: 1px solid var(--border); border-radius: 20px; padding: 3px 12px;
    margin: 0 6px 6px 0; cursor: pointer;
  }
  .search-recents button:hover { color: var(--accent-text); border-color: var(--accent); }

  /* ---- Buttons ---- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px;
    font: 600 0.85rem/1 var(--sans); border-radius: 8px; cursor: pointer;
    color: var(--text); background: var(--bg); border: 1px solid var(--border-strong);
  }
  .btn:hover { background: var(--bg-alt); }
  .btn svg.i { width: 15px; height: 15px; }
  .btn[disabled] { opacity: 0.55; cursor: default; }

  /* ---- Program gallery (examples / challenges / games) ---- */
  article .program {
    margin: 0 0 2em; padding: 4px 22px 18px; border: 1px solid var(--border); border-radius: 14px;
    scroll-margin-top: calc(var(--header-h) + 16px);
  }
  article .program h2 { margin: 0.9em 0 0.4em; border: none; padding: 0; font-size: 1.35rem; }
  .program-meta { display: flex; align-items: center; gap: 10px; margin: 0 0 0.9em; flex-wrap: wrap; }
  .program-meta code { font-size: 0.78rem; color: var(--text-muted); }
  .program-desc { color: var(--text-muted); }
  .program-desc.lead { color: var(--text); font-size: 1.02rem; }
  .program-io { margin: 0 0 1em; }
  .program-io summary {
    cursor: pointer; font-size: 0.78rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 650; padding: 4px 0;
  }
  .program-io summary:hover { color: var(--accent-text); }
  .program-io pre, .program-out pre { margin-top: 0.5em; max-height: 360px; overflow: auto; }
  .program-out pre { margin-bottom: 0; }
  .io-label {
    display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); font-weight: 700; margin-bottom: 4px;
  }
  .program-out pre { border-left: 3px solid var(--ok); }
  .run-host:empty { display: none; }
  .program .run-host { margin-top: 1em; }

  /* Run / Explain, on gallery cards and on runnable code blocks alike */
  .run-btn, .explain-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 12px;
    font: 650 0.76rem/1.6 var(--sans); cursor: pointer; border-radius: 6px;
  }
  .run-btn { color: var(--on-accent); background: var(--accent); border: 1px solid var(--accent); }
  .run-btn::before { content: ""; width: 0; height: 0; border-style: solid; border-width: 4px 0 4px 7px; border-color: transparent transparent transparent currentColor; }
  .run-btn:hover { filter: brightness(1.1); }
  .explain-btn { color: var(--text); background: var(--bg); border: 1px solid var(--border-strong); }
  .explain-btn:hover { border-color: var(--accent); color: var(--accent-text); }
  .run-btn[disabled], .explain-btn[disabled] { opacity: 0.55; cursor: progress; }

  .run-output {
    margin: -0.6em 0 1.4em; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-alt); overflow: hidden; border-left: 3px solid var(--ok);
  }
  .run-output.is-error { border-left-color: var(--err); background: var(--err-soft); }
  .run-output.is-running { border-left-color: var(--accent); }
  .run-output .ro-head {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; min-height: 36px;
    border-bottom: 1px solid var(--border); font-size: 0.74rem; font-weight: 650; color: var(--text-muted);
  }
  .run-output .ro-title { text-transform: uppercase; letter-spacing: 0.06em; }
  .run-output.is-error .ro-title { color: var(--err); }
  .run-output:not(.is-error):not(.is-running) .ro-title { color: var(--ok); }
  .run-output .ro-time { font-weight: 500; font-variant-numeric: tabular-nums; }
  .run-output .ro-actions { margin-left: auto; display: flex; gap: 2px; }
  .run-output .ro-actions button {
    border: 1px solid transparent; background: none; border-radius: 6px; cursor: pointer;
    color: var(--text-muted); font: 600 0.74rem/1 var(--sans); padding: 5px 8px;
  }
  .run-output .ro-actions button:hover { color: var(--text); background: var(--bg); border-color: var(--border); }
  .run-output pre { margin: 0; border: none; border-radius: 0; background: none; max-height: 420px; overflow: auto; }
  .run-output pre code { white-space: pre; }
  .run-output.is-error pre code { color: var(--err); white-space: pre-wrap; }
  .run-output .ro-explain { color: var(--accent-text); border-bottom: 1px dashed var(--border); }
  .run-output .ro-explain::before {
    content: "Optimizer"; display: block; font: 700 0.66rem/1.4 var(--sans); text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 4px;
  }
  .run-output .ro-empty { padding: 14px 16px; color: var(--text-muted); font-size: 0.86rem; }

  /* ---- Primitive index ---- */
  .prim-filter { position: relative; margin: 0 0 0.6em; }
  .prim-filter svg.i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 17px; height: 17px; pointer-events: none; }
  .prim-filter input {
    width: 100%; height: 42px; padding: 0 14px 0 38px; border: 1px solid var(--border-strong); border-radius: 9px;
    background: var(--bg); color: var(--text); font-size: 0.95rem; font-family: var(--sans);
  }
  .prim-filter input:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
  .prim-count { font-size: 0.8rem; color: var(--text-muted); margin: 6px 2px 0; }
  article table.prim-index { font-size: 0.87rem; }
  article table.prim-index td:first-child { white-space: nowrap; }
  article .prim-sig { white-space: nowrap; font-size: 0.82em; }
  .empty-filter { color: var(--text-muted); padding: 24px 0; }
  /* On a phone three columns cannot all be readable at once, so each row
     becomes a small card: name and type on one line, the summary beneath. */
  @media (max-width: 640px) {
    article table.prim-index { display: block; border: none; border-radius: 0; overflow: visible; }
    article table.prim-index thead { display: none; }
    article table.prim-index tbody, article table.prim-index tr { display: block; }
    article table.prim-index tr { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
    article table.prim-index td { display: block; border: none !important; padding: 2px 0; background: none !important; }
    article table.prim-index .prim-sig { white-space: normal; }
  }

  /* ---- Playground ---- */
  .pg-shell {
    border: 1px solid var(--border-strong); border-radius: 14px; overflow: hidden; margin: 0 0 16px;
    background: var(--bg-alt);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--jjk-c, var(--accent)) 18%, transparent),
      0 0 28px -16px var(--jjk-c, var(--accent));
  }
  .pg-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px;
    border-bottom: 1px solid var(--border); background: var(--bg);
  }
  .pg-bar .pg-run {
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 16px;
    font: 700 0.86rem/1 var(--sans); cursor: pointer; color: #fff;
    /* Simple Domain's green is a light one; darkening the fill keeps the hue
       while the white label stays legible whatever colour a page carries. */
    background: color-mix(in srgb, var(--jjk-c, var(--accent)) 50%, #16161c);
    border: 1px solid color-mix(in srgb, var(--jjk-c, var(--accent)) 50%, #16161c);
    border-radius: 8px;
  }
  .pg-bar .pg-run:hover { filter: brightness(1.12); }
  .pg-bar .pg-run[disabled] { opacity: 0.6; cursor: progress; }
  .pg-bar .pg-run kbd { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.25); color: #fff; }
  @media (hover: none) and (pointer: coarse) { .pg-run kbd { display: none; } }
  .pg-bar select {
    height: 34px; width: 13rem; padding: 0 10px; font: 500 0.84rem/1 var(--sans); color: var(--text); max-width: 100%;
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 8px; cursor: pointer;
  }
  .pg-bar .pg-spacer { flex: 1; }
  .pg-status { font-size: 0.8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .pg-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  .pg-pane { display: flex; flex-direction: column; min-width: 0; }
  .pg-pane + .pg-pane { border-left: 1px solid var(--border); }
  .pg-pane label {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-muted); font-weight: 700; padding: 8px 14px 0;
  }
  .pg-pane textarea {
    width: 100%; min-height: 280px; flex: 1; padding: 8px 14px 14px; resize: vertical;
    font-family: var(--mono); font-size: 0.86rem; line-height: 1.55; white-space: pre; overflow: auto;
    border: none; background: var(--bg-code); color: var(--text); tab-size: 2;
  }
  .pg-pane textarea:focus-visible { outline: 2px solid var(--jjk-c, var(--focus)); outline-offset: -2px; border-radius: 0; }
  .pg-out { border-top: 1px solid var(--border); }
  .pg-out .run-output { margin: 0; border: none; border-radius: 0; }
  @media (max-width: 760px) {
    .pg-grid { grid-template-columns: 1fr; }
    .pg-pane + .pg-pane { border-left: none; border-top: 1px solid var(--border); }
    .pg-pane textarea { min-height: 200px; }
    .pg-pane textarea.pg-input { min-height: 120px; }
  }
  .pg-unavailable {
    padding: 16px 18px; border: 1px solid var(--border); border-left: 3px solid var(--warn); border-radius: var(--radius);
    background: var(--bg-alt); color: var(--text); font-size: 0.9rem; margin: 0 0 16px;
  }
  .pg-unavailable code { font-size: 0.85em; }

  /* Which build is serving these pages. Only appears when the site is served
     by the binary, which is the only context that can know. */
  .build-stamp {
    margin: 22px 6px 0; padding-top: 14px; border-top: 1px solid var(--border);
    font-size: 0.72rem; color: var(--text-muted); line-height: 1.5;
  }
  .build-stamp code { font-family: var(--mono); font-size: 0.95em; }
  .build-stamp .dirty { color: var(--warn); font-weight: 600; }

  /* Loading: a skeleton of the page shape rather than a lone spinner. */
  .loading { padding: 8px 0 40px; color: var(--text-muted); }
  .skeleton i { display: block; height: 14px; margin: 0 0 12px; border-radius: 6px; background: var(--bg-alt);
    background: linear-gradient(90deg, var(--bg-alt) 25%, color-mix(in srgb, var(--border) 70%, var(--bg-alt)) 50%, var(--bg-alt) 75%) 0 0 / 300% 100%;
    animation: shimmer 1.3s linear infinite; }
  .skeleton i:first-child { height: 34px; width: 55%; margin-bottom: 24px; }
  .skeleton i:nth-child(3n) { width: 80%; }
  .skeleton i:nth-child(4) { width: 92%; }
  @keyframes shimmer { to { background-position: -150% 0; } }
  .error-box {
    padding: 18px 20px; border: 1px solid var(--border); border-left: 3px solid var(--err);
    border-radius: var(--radius); background: var(--err-soft); color: var(--text); margin: 0 0 1em;
  }
  .error-box h2 { margin-top: 0; color: var(--err); border: none; font-size: 1.2rem; }
  .error-box code { background: var(--bg-code); padding: 2px 6px; border-radius: 4px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border-strong);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Landing page ---- */
  .site-hero {
    position: relative; overflow: hidden; margin: 0 0 1.6em;
    padding: 40px 36px 32px; border-radius: 18px; border: 1px solid var(--border);
    background: radial-gradient(ellipse 80% 70% at 85% 10%,
      color-mix(in srgb, var(--jjk-c, var(--accent)) 16%, var(--bg-alt)), var(--bg-alt));
  }
  .hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hero-inner { position: relative; z-index: 1; }
  .hero-eyebrow {
    font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700;
    color: color-mix(in srgb, var(--jjk-c, var(--accent-text)) 55%, var(--text)); margin: 0 0 10px;
  }
  .hero-title { font-size: clamp(2.4rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: -0.035em; margin: 0 0 12px; line-height: 1.02; }
  .hero-tag { font-size: 1.1rem; line-height: 1.55; color: var(--text-muted); margin: 0 0 22px; max-width: 42ch; }
  .hero-tag em { color: var(--text); font-style: normal; font-weight: 650; }
  .hero-ctas { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 24px; }
  .hero-ctas a { display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 18px; border-radius: 10px; font-weight: 650; font-size: 0.92rem; }
  .hero-ctas a:hover { text-decoration: none; filter: brightness(1.08); }
  .hero-ctas .primary { background: var(--accent); color: var(--on-accent); }
  .hero-ctas .secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border-strong); }
  .hero-demo {
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    background: var(--bg-code); box-shadow: var(--shadow); max-width: 620px;
  }
  .hero-demo-head { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg-code-head); font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
  .hero-demo-head b { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); }
  .hero-demo-head span { margin-left: 6px; }
  .hero-demo-head a { margin-left: auto; font-weight: 600; }
  .hero-demo pre { margin: 0; padding: 14px 16px; font-size: 0.82rem; line-height: 1.6; overflow-x: auto; border: none; border-radius: 0; background: none; }
  .hero-demo-out {
    border-top: 1px solid var(--border); padding: 10px 16px; min-height: 1.5em;
    font-family: var(--mono); font-size: 0.78rem; color: var(--text-muted);
    white-space: pre-wrap; background: var(--bg-alt);
  }
  .start-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 0 0 2.2em; }
  .start-card {
    display: flex; gap: 14px; padding: 16px 18px; border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); background: var(--bg); transition: border-color 0.12s ease, transform 0.12s ease;
  }
  .start-card:hover { text-decoration: none; border-color: var(--accent); transform: translateY(-1px); }
  .start-card .sc-icon {
    flex: none; width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent-text);
  }
  .start-card strong { display: block; font-size: 0.98rem; }
  .start-card span { display: block; font-size: 0.85rem; color: var(--text-muted); line-height: 1.45; margin-top: 2px; }
  @media (max-width: 640px) {
    .site-hero { padding: 26px 18px 20px; border-radius: 14px; }
    .hero-canvas { opacity: 0.35; }
    .start-grid { grid-template-columns: 1fr; }
  }
  /* ---- JJK technique banners (one per doc, all different) ---- */
  .jjk-banner {
    /* A slim strip rather than a billboard: it names the page's technique and
       gets out of the way of the content. min-height, not height, so a tag
       that wraps on a phone is never cropped. */
    position: relative; overflow: hidden; min-height: 60px; margin: 0 0 22px;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg-alt);
    background: linear-gradient(100deg, color-mix(in srgb, var(--jjk-c) 14%, var(--bg-alt)), var(--bg-alt) 60%);
    display: flex; align-items: center; gap: 16px; padding: 8px 18px 8px 10px;
  }
  .jjk-fx { position: relative; width: 84px; height: 44px; flex: none; transform: scale(0.85);
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--jjk-c) 55%, transparent)); }
  .jjk-banner .jjk-label { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; row-gap: 0; min-width: 0; line-height: 1.4; }
  /* Each banner's colour is chosen for the theme, not for contrast; the kanji
     is a label, so it is mixed toward the body text until it clears 4.5:1. */
  .jjk-banner .kanji {
    font-size: 1.02rem; font-weight: 700; letter-spacing: 0.02em;
    color: color-mix(in srgb, var(--jjk-c) 42%, var(--text));
  }
  .jjk-banner .name { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text); }
  .jjk-banner .tag { flex-basis: 100%; font-size: 0.82rem; color: var(--text-muted); }

  /* 1. README — Infinity: expanding rings */
  .fx-rings i {
    position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border: 2px solid var(--jjk-c); border-radius: 50%; opacity: 0.9;
    animation: jjkRipple 2.4s ease-out infinite;
  }
  .fx-rings i:nth-child(2) { animation-delay: -0.8s; }
  .fx-rings i:nth-child(3) { animation-delay: -1.6s; }
  @keyframes jjkRipple {
    0% { width: 10px; height: 10px; margin: -5px 0 0 -5px; opacity: 0.9; }
    100% { width: 80px; height: 80px; margin: -40px 0 0 -40px; opacity: 0; }
  }

  /* 2. getting-started — Black Flash: synchronized spike burst */
  .fx-flash .core {
    position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    background: var(--jjk-c); border-radius: 50%; animation: jjkCore 0.9s ease-in-out infinite;
    filter: drop-shadow(0 0 6px var(--jjk-c));
  }
  .fx-flash i {
    position: absolute; left: 50%; top: 50%; width: 2px; height: 26px; margin: -13px 0 0 -1px;
    background: var(--jjk-c); transform-origin: center; opacity: 0;
    animation: jjkSpike 0.9s ease-out infinite;
  }
  .fx-flash i:nth-child(2) { --r: 0deg; }
  .fx-flash i:nth-child(3) { --r: 60deg; }
  .fx-flash i:nth-child(4) { --r: 120deg; }
  .fx-flash i:nth-child(5) { --r: 180deg; }
  .fx-flash i:nth-child(6) { --r: 240deg; }
  .fx-flash i:nth-child(7) { --r: 300deg; }
  @keyframes jjkCore { 0%, 100% { transform: scale(0.6); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 1; } }
  @keyframes jjkSpike {
    0% { opacity: 0; transform: rotate(var(--r)) scaleY(0.3); }
    45% { opacity: 1; transform: rotate(var(--r)) scaleY(1); }
    60% { opacity: 0; transform: rotate(var(--r)) scaleY(1.15); }
    100% { opacity: 0; transform: rotate(var(--r)) scaleY(1.15); }
  }

  /* 3. language — Cursed Speech: floating glyphs */
  .fx-speech { overflow: visible; }
  .fx-speech span {
    position: absolute; bottom: 4px; font-weight: 700; font-size: 1rem; color: var(--jjk-c);
    opacity: 0; animation: jjkFloat 3s ease-in infinite;
  }
  .fx-speech span:nth-child(1) { left: 8%; animation-delay: 0s; }
  .fx-speech span:nth-child(2) { left: 42%; animation-delay: -1s; }
  .fx-speech span:nth-child(3) { left: 74%; animation-delay: -2s; }
  @keyframes jjkFloat {
    0% { opacity: 0; transform: translateY(0); }
    15% { opacity: 1; }
    85% { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(-38px); }
  }

  /* 4. primitives — Ten Shadows: marching shikigami */
  .fx-shadows i {
    position: absolute; bottom: 6px; left: -10px; width: 8px; height: 14px;
    background: var(--jjk-c); border-radius: 2px 2px 0 0; opacity: 0.85;
    animation: jjkMarch 2.6s linear infinite;
  }
  .fx-shadows i:nth-child(2) { animation-delay: -0.65s; }
  .fx-shadows i:nth-child(3) { animation-delay: -1.3s; }
  .fx-shadows i:nth-child(4) { animation-delay: -1.95s; }
  @keyframes jjkMarch { 0% { left: -10px; } 100% { left: 90px; } }

  /* 5. expressions — Straw Doll Technique: resonance thread */
  .fx-thread .line {
    position: absolute; left: 0; right: 0; top: 50%; height: 2px;
    background-image: repeating-linear-gradient(90deg, var(--jjk-c) 0 6px, transparent 6px 12px);
    background-size: 24px 2px; animation: jjkStitch 1.4s linear infinite;
  }
  .fx-thread .knot {
    position: absolute; top: 50%; width: 6px; height: 6px; margin-top: -3px;
    border-radius: 50%; background: var(--jjk-c); animation: jjkKnot 2.8s ease-in-out infinite;
  }
  @keyframes jjkStitch { to { background-position: -24px 0; } }
  @keyframes jjkKnot { 0%, 100% { left: 4%; } 50% { left: 90%; } }

  /* 6. aoc-toolbox — Domain Amplification: pulsing dashed ring */
  .fx-amplify .core {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border-radius: 50%; background: var(--jjk-c);
  }
  .fx-amplify .ring {
    position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
    border-radius: 50%; border: 2px dashed var(--jjk-c); animation: jjkAmplify 2.4s ease-in-out infinite;
  }
  @keyframes jjkAmplify {
    0%, 100% { transform: scale(0.8) rotate(0deg); opacity: 0.5; }
    50% { transform: scale(1.4) rotate(180deg); opacity: 1; }
  }

  /* 7. data-model — Cursed Energy: flowing particles */
  .fx-particles i {
    position: absolute; left: -6px; top: 50%; width: 6px; height: 6px; margin-top: -3px;
    border-radius: 50%; background: var(--jjk-c); opacity: 0; animation: jjkFlow 2.2s linear infinite;
  }
  .fx-particles i:nth-child(1) { top: 30%; animation-delay: 0s; }
  .fx-particles i:nth-child(2) { top: 45%; animation-delay: -0.55s; }
  .fx-particles i:nth-child(3) { top: 60%; animation-delay: -1.1s; }
  .fx-particles i:nth-child(4) { top: 75%; animation-delay: -1.65s; }
  @keyframes jjkFlow { 0% { left: -6px; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { left: 88px; opacity: 0; } }

  /* 8. match-pattern — Six Eyes: scanning sweep over a grid */
  .fx-scan {
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 10px 10px; border-radius: 8px;
  }
  .fx-scan i {
    position: absolute; top: 0; bottom: 0; left: 0; width: 3px; background: var(--jjk-c);
    box-shadow: 0 0 10px var(--jjk-c); animation: jjkScan 2.4s ease-in-out infinite;
  }
  @keyframes jjkScan { 0%, 100% { left: 0; } 50% { left: 81px; } }

  /* 9. cli — Playful Cloud: streaking projectile */
  .fx-streak i {
    position: absolute; left: -10px; top: 50%; width: 10px; height: 10px; margin-top: -5px;
    border-radius: 50%; background: var(--jjk-c); box-shadow: -16px 0 10px -3px var(--jjk-c);
    animation: jjkStreak 1.5s ease-in infinite;
  }
  @keyframes jjkStreak { 0% { left: -10px; opacity: 0; } 20% { opacity: 1; } 88% { opacity: 1; } 100% { left: 90px; opacity: 0; } }

  /* 10. diagnostics — Reverse Cursed Technique: healing pulse */
  .fx-pulse .glow {
    position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px;
    border-radius: 50%; background: radial-gradient(circle, var(--jjk-c) 0%, transparent 70%);
    opacity: 0.5; animation: jjkHeal 2.6s ease-in-out infinite;
  }
  .fx-pulse .cross {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    animation: jjkHealCore 2.6s ease-in-out infinite;
  }
  .fx-pulse .cross::before, .fx-pulse .cross::after { content: ""; position: absolute; background: var(--jjk-c); border-radius: 2px; }
  .fx-pulse .cross::before { left: 7px; top: 0; width: 2px; height: 16px; }
  .fx-pulse .cross::after { left: 0; top: 7px; width: 16px; height: 2px; }
  @keyframes jjkHeal { 0%, 100% { transform: scale(0.7); opacity: 0.35; } 50% { transform: scale(1.15); opacity: 0.8; } }
  @keyframes jjkHealCore { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  /* 11. tooling — Divine Dogs: two familiars crossing */
  .fx-cross i {
    position: absolute; top: 50%; left: 50%; width: 36px; height: 2px; background: var(--jjk-c);
    opacity: 0; animation: jjkCross 2s ease-in-out infinite;
  }
  .fx-cross i:nth-child(1) { --r: 35deg; animation-delay: 0s; }
  .fx-cross i:nth-child(2) { --r: -35deg; animation-delay: -1s; }
  @keyframes jjkCross {
    0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--r)) translateX(-40px); }
    45% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--r)) translateX(0); }
    55% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--r)) translateX(40px); }
  }

  /* 12. optimizer — Malevolent Shrine: dropping skewers */
  .fx-skewers i {
    position: absolute; top: -20px; width: 2px; height: 20px; background: var(--jjk-c);
    animation: jjkSkewer 1.1s cubic-bezier(0.7, 0, 1, 1) infinite;
  }
  .fx-skewers i:nth-child(1) { left: 10px; animation-delay: 0s; }
  .fx-skewers i:nth-child(2) { left: 26px; animation-delay: -0.15s; }
  .fx-skewers i:nth-child(3) { left: 42px; animation-delay: -0.3s; }
  .fx-skewers i:nth-child(4) { left: 58px; animation-delay: -0.45s; }
  .fx-skewers i:nth-child(5) { left: 74px; animation-delay: -0.6s; }
  @keyframes jjkSkewer {
    0% { top: -20px; opacity: 0; }
    10% { opacity: 1; }
    55% { top: 48px; opacity: 1; }
    65% { opacity: 0; }
    100% { top: 48px; opacity: 0; }
  }

  /* 13. compiler — Domain Expansion: the barrier manifests */
  .fx-expand .barrier {
    position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
    border-radius: 50%; border: 2px solid var(--jjk-c); animation: jjkBarrier 2.8s ease-out infinite;
  }
  .fx-expand .burst {
    position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
    background: var(--jjk-c); border-radius: 50%; animation: jjkBurst 2.8s ease-out infinite;
  }
  @keyframes jjkBarrier {
    0% { width: 8px; height: 8px; margin: -4px 0 0 -4px; opacity: 1; border-radius: 50%; }
    70% { opacity: 0.6; }
    100% { width: 84px; height: 48px; margin: -24px 0 0 -42px; opacity: 0; border-radius: 10px; }
  }
  @keyframes jjkBurst { 0%, 55% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.4); } }

  /* 14. playground — Simple Domain: a dome drawn and held */
  .fx-simple .dome {
    position: absolute; left: 50%; top: 58%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border: 2px solid var(--jjk-c); border-radius: 50%; border-bottom-color: transparent;
    animation: jjkDome 3s ease-in-out infinite;
  }
  .fx-simple .core {
    position: absolute; left: 50%; top: 58%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
    border-radius: 50%; background: var(--jjk-c); animation: jjkCore 3s ease-in-out infinite;
  }
  @keyframes jjkDome {
    0%, 100% { transform: scale(0.55) rotate(0deg); opacity: 0.45; }
    50% { transform: scale(1) rotate(180deg); opacity: 1; }
  }

  /* 15. examples — Curtain: panels dropping to reveal what is inside */
  .fx-curtain i {
    position: absolute; top: 0; width: 5px; height: 100%; background: var(--jjk-c);
    opacity: 0.75; transform-origin: top; animation: jjkCurtain 3s ease-in-out infinite;
  }
  .fx-curtain i:nth-child(1) { left: 6px;  animation-delay: 0s; }
  .fx-curtain i:nth-child(2) { left: 22px; animation-delay: -0.4s; }
  .fx-curtain i:nth-child(3) { left: 38px; animation-delay: -0.8s; }
  .fx-curtain i:nth-child(4) { left: 54px; animation-delay: -1.2s; }
  .fx-curtain i:nth-child(5) { left: 70px; animation-delay: -1.6s; }
  @keyframes jjkCurtain {
    0%, 100% { transform: scaleY(1); opacity: 0.75; }
    50% { transform: scaleY(0.15); opacity: 0.3; }
  }

  /* 16. challenges — Cursed Tool: two crossing slashes */
  .fx-blade i {
    position: absolute; top: 50%; left: 50%; width: 62px; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--jjk-c), transparent);
    animation: jjkSlash 1.8s ease-in-out infinite;
  }
  .fx-blade i:nth-child(1) { --r: 28deg; animation-delay: 0s; }
  .fx-blade i:nth-child(2) { --r: -28deg; animation-delay: -0.9s; }
  @keyframes jjkSlash {
    0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--r)) scaleX(0.2); }
    35% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--r)) scaleX(1); }
    70% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--r)) scaleX(1); }
    100% { opacity: 0; }
  }

  /* 17. primitive-index — Heavenly Restriction: everything bound to one point */
  .fx-bind .knot {
    position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
    border-radius: 50%; background: var(--jjk-c); box-shadow: 0 0 8px var(--jjk-c);
  }
  .fx-bind i {
    position: absolute; left: 50%; top: 50%; width: 30px; height: 1.5px; background: var(--jjk-c);
    transform-origin: left center; opacity: 0.8; animation: jjkBind 2.6s ease-in-out infinite;
  }
  .fx-bind i:nth-child(2) { --r: 20deg;  animation-delay: 0s; }
  .fx-bind i:nth-child(3) { --r: 110deg; animation-delay: -0.65s; }
  .fx-bind i:nth-child(4) { --r: 200deg; animation-delay: -1.3s; }
  .fx-bind i:nth-child(5) { --r: 290deg; animation-delay: -1.95s; }
  @keyframes jjkBind {
    0%, 100% { transform: rotate(var(--r)) scaleX(1); opacity: 0.25; }
    50% { transform: rotate(var(--r)) scaleX(0.3); opacity: 1; }
  }

  @media (max-width: 860px) {
    .jjk-banner { min-height: 60px; padding: 10px 14px; gap: 12px; }
    .jjk-fx { width: 60px; height: 44px; }
  }

  /* Motion is decoration here, so it is bounded: a technique plays a few
     times when its page opens and then rests, and none of it plays at all for
     a reader who has asked for reduced motion. */
  .jjk-banner * { animation-iteration-count: 4 !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important; scroll-behavior: auto !important;
    }
    .jjk-banner * { animation: none !important; }
  }

  /* ---- Print ----
     A reference page is worth printing, and everything that makes it navigable
     on screen is noise on paper. What matters is that code blocks do not get
     cut off mid-line and that links keep their targets. */
  @media print {
    .topbar, .skip-link, .sidebar, .page-toc, .toc-mobile, .crumbs, .scrim, .search-overlay,
    .page-nav, .page-edit, .jjk-banner, .copy-btn, .run-btn, .explain-btn, .run-host,
    .heading-anchor, .build-stamp, .prim-filter, .hero-canvas, .hero-ctas, .start-grid { display: none !important; }
    html, body { background: #fff !important; color: #000 !important; }
    .layout, .main-wrap { display: block; }
    main { max-width: none; padding: 0; }
    article pre, article code {
      background: #f6f6f6 !important; border: 1px solid #ddd !important; color: #000 !important;
    }
    article pre::before { display: none !important; }
    article pre, article pre:has(> .copy-btn) { padding: 10px 12px !important; overflow: visible !important; }
    article pre .lang-tag { position: static !important; display: block; line-height: 1.4 !important; }
    /* …but not the <code> inside a <pre>, which already has the block's box
       around it: a wrapped inline box is drawn once per fragment. */
    article pre code {
      background: none !important; border: none !important; padding: 0 !important; overflow: visible !important;
    }
    /* Long pipelines and type signatures wrap rather than vanish off the edge. */
    article pre, article pre code { white-space: pre-wrap; word-break: break-word; }
    article table { display: table; width: 100%; }
    article h1, article h2, article h3 { break-after: avoid; page-break-after: avoid; }
    article pre, article table, .program { break-inside: avoid; page-break-inside: avoid; }
    article .program { border: none; padding: 0; }
    /* Only external links are expanded; in-app routes mean nothing on paper. */
    article a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.85em; color: #555; }
    .tok-kw, .tok-arg, .tok-str, .tok-num, .tok-op, .tok-comment, .tok-def { color: #000 !important; }
    .tok-kw { font-weight: 700; }
    .tok-comment { font-style: italic; color: #555 !important; }
  }
</style>

// Draws an octagon of radius r (0 draws nothing) centered on the canvas's
// current translation, at rotation rot.
function drawOctagon(ctx, r, rot) {
  if (r <= 0) return;
  ctx.beginPath();
  for (let i = 0; i <= 8; i++) {
    const a = rot + (i / 8) * Math.PI * 2;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

// The barrier snaps open once (the "cast"), then settles into a slow ambient
// pulse — self-terminating once the canvas leaves the document, since the SPA
// router swaps #content wholesale rather than tearing down listeners per page.
function initHeroCanvas() {
  const canvas = document.getElementById("heroCanvas");
  // Guards both a missing element and the test harness's DOM stub, which has
  // no <canvas> or layout engine behind getContext()/parentElement.
  if (!canvas || typeof canvas.getContext !== "function" || !canvas.parentElement) return;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const color = (getComputedStyle(document.documentElement).getPropertyValue("--jjk-c") || "#7c3aed").trim();
  const CAST_MS = 1300;

  function size() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  window.addEventListener("resize", size);

  const start = performance.now();
  function frame(t) {
    if (!document.body.contains(canvas)) return; // page navigated away
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const cx = w * 0.8, cy = h * 0.38;
    const elapsed = t - start;
    const castP = reduce ? 1 : Math.min(1, elapsed / CAST_MS);
    const eased = 1 - Math.pow(1 - castP, 3);
    const maxR = Math.min(w, h) * 0.6;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = 0.5 * eased;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    drawOctagon(ctx, maxR * eased, reduce ? 0 : elapsed * 0.00018);
    ctx.restore();

    if (castP >= 1) {
      const ambient = reduce ? 0.3 : ((elapsed - CAST_MS) * 0.00035) % 1;
      for (let i = 0; i < 3; i++) {
        const p = reduce ? 0.3 : (ambient + i / 3) % 1;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.globalAlpha = 0.3 * (1 - p);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        drawOctagon(ctx, maxR * 0.3 * (1 + p), 0);
        ctx.restore();
      }
    }
    if (!reduce || castP < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

const contentEl = document.getElementById("content");

// a page — while the search dialog is open it holds the query instead.

// The page whose content is currently in the DOM. Distinct from activeDocId,
