// A title written "· Sources" is a sub-page of the entry above it: the
// manifest's own way of saying the reference hangs off two hub pages.
function isChildDoc(d) { return d.title.startsWith("· "); }
function navTitle(d) { return d.title.replace(/^·\s*/, ""); }
function parentDoc(d) {
  if (!isChildDoc(d)) return null;
  for (let i = DOCS.indexOf(d) - 1; i >= 0; i--) if (!isChildDoc(DOCS[i])) return DOCS[i];
  return null;
}
// Families the reader has opened or closed by hand; otherwise a family is
// open exactly when the page on screen belongs to it.
const navExpanded = {};

function renderNav(activeId) {
  const active = DOC_BY_ID[activeId];
  const activeFamily = active ? (parentDoc(active) || active).id : "";
  let html = "";
  let lastGroup = null;
  for (let i = 0; i < DOCS.length; i++) {
    const d = DOCS[i];
    if (isChildDoc(d)) continue; // rendered inside its parent below
    if (d.group !== lastGroup) {
      html += `<div class="group-label" role="presentation">${d.group}</div>`;
      lastGroup = d.group;
    }
    const kids = [];
    for (let j = i + 1; j < DOCS.length && isChildDoc(DOCS[j]); j++) kids.push(DOCS[j]);
    const link = (doc, withDesc) => {
      const on = doc.id === activeId;
      return `<a class="doc-link${on ? " active" : ""}" href="#/${doc.id}" data-route` +
        (on ? ` aria-current="page"` : "") + (withDesc ? "" : ` title="${escapeHtml(doc.desc)}"`) + `>` +
        `${escapeHtml(navTitle(doc))}${withDesc ? `<span class="desc">${escapeHtml(doc.desc)}</span>` : ""}</a>`;
    };
    if (!kids.length) { html += link(d, true); continue; }
    const open = navExpanded[d.id] ?? (activeFamily === d.id);
    html += `<div class="nav-row">${link(d, true)}` +
      `<button class="nav-twisty" type="button" data-nav-toggle="${d.id}" aria-expanded="${open}" ` +
      `aria-controls="navkids-${d.id}" aria-label="${open ? "Hide" : "Show"} ${kids.length} pages under ${escapeHtml(navTitle(d))}">` +
      `<svg class="i" aria-hidden="true"><use href="#i-chev"/></svg></button></div>` +
      `<div class="nav-children" id="navkids-${d.id}"${open ? "" : " hidden"}>${kids.map(k => link(k, false)).join("")}</div>`;
  }
  docNavEl.innerHTML = html;
}

docNavEl.addEventListener("click", e => {
  const t = e.target.closest("[data-nav-toggle]");
  if (!t) return;
  const id = t.getAttribute("data-nav-toggle");
  navExpanded[id] = t.getAttribute("aria-expanded") !== "true";
  renderNav(activeDocId);
  const again = docNavEl.querySelector(`[data-nav-toggle="${id}"]`);
  if (again) again.focus();
});

// Breadcrumbs: section, then the hub page for a sub-page, then the page.
function renderCrumbs(docId) {
  const el = document.getElementById("crumbs");
  const d = DOC_BY_ID[docId];
  if (!el || !d) return;
  if (docId === "README") { el.innerHTML = ""; return; }
  const parts = [`<li><a href="#/README" data-route>Docs</a></li>`, `<li>${escapeHtml(d.group)}</li>`];
  const p = parentDoc(d);
  if (p) parts.push(`<li><a href="#/${p.id}" data-route>${escapeHtml(navTitle(p))}</a></li>`);
  parts.push(`<li aria-current="page">${escapeHtml(navTitle(d))}</li>`);
  el.innerHTML = `<ol>${parts.join("")}</ol>`;
}

async function fetchDoc(doc) {
  if (rawCache[doc.id]) return rawCache[doc.id];
  const res = await fetch(doc.file, { cache: "no-cache" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  rawCache[doc.id] = text;
  return text;
}

// The two generated data files behind the gallery and the primitive index.
// Each is fetched once; a failure is cached as an empty list so a missing file
// degrades to an empty page rather than retrying on every navigation.
const jsonCache = {};
async function fetchJSON(file) {
  if (jsonCache[file]) return jsonCache[file];
  jsonCache[file] = (async () => {
    try {
      const res = await fetch(file, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } catch (e) {
      return [];
    }
  })();
  return jsonCache[file];
}
const fetchGallery = () => fetchJSON("gallery.json");
const fetchPrimitives = () => fetchJSON("primitives.json");

async function loadAllForIndex() {
  // Promise.all preserves order, so the index is assembled in manifest order
  // and equally-scored results always come back in the same order.
  const perDoc = await Promise.all(DOCS.map(async d => {
    try {
      // The generated pages are indexed from their data, so searching for
      // "fizzbuzz" or a primitive's signature finds them alongside the prose.
      if (d.kind === "gallery") {
        const all = await fetchGallery();
        return buildGalleryEntries(d.id, navTitle(d), all.filter(p => p.group === d.galleryGroup));
      }
      if (d.kind === "primitives") {
        return buildPrimitiveEntries(d.id, navTitle(d), await fetchPrimitives());
      }
      if (d.kind) return []; // the playground has no text to index
      return buildSearchEntries(d.id, navTitle(d), await fetchDoc(d));
    } catch (e) {
      // A page that will not load is simply missing from the index — but say
      // so. Swallowing this silently is what let the whole index sit empty
      // without a single visible symptom.
      console.warn(`docs: could not index ${d.id}:`, e);
      return [];
    }
  }));
  searchIndex = perDoc.flat();
}

function renderPageToc(headings, docId) {
  // The page's own title is the first heading; listing it as the first entry
  // only repeats what is already at the top of the column.
  const items = headings.filter((h, i) => h.level <= 3 && !(i === 0 && h.level === 1));
  if (items.length < 2) {
    pageTocEl.innerHTML = "";
    return;
  }
  let links = "";
  for (const h of items) {
    // Entries are the heading text, which in the primitive reference carries
    // the full signature ("Map Each — List<T> × (T -> U) -> List<U>") and wrapped
    // to three lines each, making the column unscannable. The name before the
    // em dash is what someone scans for; the signature is one click away.
    const label = h.text.split("—")[0].trim() || h.text;
    links += `<a class="${h.level === 3 ? "h3" : ""}" href="#/${docId}#${h.slug}" data-route data-slug="${h.slug}" title="${escapeHtml(h.text)}">${escapeHtml(label)}</a>`;
  }
  pageTocEl.innerHTML = '<div class="label" aria-hidden="true">On this page</div>' + links +
    `<a class="to-top" href="#/${docId}" data-route>↑ Back to top</a>`;
  // The same list, folded under the title, for screens too narrow for the
  // right rail (CSS shows one or the other). The landing page has its own
  // start-here cards instead.
  const h1 = docId !== "README" && contentEl.querySelector("article h1");
  if (h1) {
    h1.insertAdjacentHTML("afterend", `<details class="toc-mobile"><summary>On this page</summary>` +
      `<nav class="toc-list" aria-label="On this page">${links}</nav></details>`);
  }
}

function renderPageNav(activeId) {
  const idx = DOCS.findIndex(d => d.id === activeId);
  const prev = DOCS[idx - 1], next = DOCS[idx + 1];
  let html = "";
  html += prev ? `<a class="prev" href="#/${prev.id}" data-route><span class="dir">← Previous</span><span class="ttl">${escapeHtml(navTitle(prev))}</span></a>` : "<span></span>";
  html += next ? `<a class="next" href="#/${next.id}" data-route><span class="dir">Next →</span><span class="ttl">${escapeHtml(navTitle(next))}</span></a>` : "<span></span>";
  pageNavEl.innerHTML = html;
}

// What a page looks like while it loads: its shape, not a lone spinner.
const SKELETON = '<div class="loading skeleton" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i><i></i><i></i></div>';

// Whether the next render came from the reader moving between pages (rather
// than the first load), in which case focus follows them to the new content —
// otherwise a keyboard or screen-reader user is left on a link that no longer
// describes where they are.
let movedByReader = false;

async function route() {
  const hash = location.hash.replace(/^#\/?/, "");

  // #/search?q=… opens the dialog with a query already in it, so a search can
  // be linked to, bookmarked, or pasted into an issue. The page underneath is
  // left as it was — or, when the link is the first thing opened, the page the
  // reader would have been on, rather than a page stuck on its loading state.
  const searchRoute = hash.match(/^search\?q=(.*)$/);
  if (searchRoute) {
    let q = "";
    try { q = decodeURIComponent(searchRoute[1].replace(/\+/g, " ")); } catch (e) { q = searchRoute[1]; }
    openSearch(q);
    if (renderedDocId === null) await showPage(activeDocId, "");
    return;
  }

  // Format: docId or docId#anchor
  const hashParts = hash.split("#");
  let docId = hashParts[0] || "README";
  const anchor = hashParts[1] || "";
  // A bare in-page anchor ("#where-to-start", as Markdown writes them) is not
  // a page: resolve it against the page on screen instead of falling back to
  // the overview, which is where every such link used to land.
  if (!DOC_BY_ID[docId] && hashParts.length === 1 && renderedDocId && document.getElementById(docId)) {
    replaceHash(`#/${renderedDocId}#${docId}`);
    scrollToAnchor(docId);
    return;
  }
  if (!DOC_BY_ID[docId]) docId = "README";
  await showPage(docId, anchor);
}

async function showPage(docId, anchor) {
  const doc = DOC_BY_ID[docId];
  activeDocId = docId;
  applyPageAccent(docId);

  // Moving to another anchor on the page already displayed is a scroll, not a
  // navigation. Re-rendering would refetch and rebuild the whole document —
  // and would replace the very heading link the reader just clicked, which is
  // why its "copied" confirmation never survived long enough to be read.
  if (docId === renderedDocId) {
    scrollToAnchor(anchor);
    setupScrollSpy();
    return;
  }

  document.title = docId === "README" ? "Domain documentation" : `${navTitle(doc)} · Domain documentation`;
  renderNav(docId);
  renderCrumbs(docId);
  renderPageNav(docId);
  contentEl.innerHTML = SKELETON;

  // Pages built from data rather than Markdown.
  if (doc.kind) {
    let rendered;
    if (doc.kind === "gallery") rendered = await renderGalleryPage(doc);
    else if (doc.kind === "primitives") rendered = await renderPrimitiveIndexPage(doc);
    else rendered = renderPlaygroundPage(doc);
    if (activeDocId !== docId) return; // the reader moved on while this loaded
    contentEl.innerHTML = renderDocBanner(docId) +
      `<article>${rendered.html.replace(/__DOCID__/g, docId)}</article>`;
    renderPageToc(rendered.headings || [], docId);
    if (rendered.afterRender) rendered.afterRender();
    finishRender(docId, anchor);
    return;
  }

  let md;
  try {
    md = await fetchDoc(doc);
  } catch (e) {
    const isFile = location.protocol === "file:";
    contentEl.innerHTML = `<div class="error-box"><h2>Couldn't load ${escapeHtml(doc.file)}</h2>` +
      (isFile
        ? `<p>Browsers block <code>fetch()</code> of local files when you open this page directly from disk (<code>file://</code>).</p>
           <p>Serve it over HTTP instead. The simplest way is the built-in command, which serves this site (embedded in the binary) and opens it for you:</p>
           <pre><code>domain expansion: documentation
# then open  http://localhost:4444/  (use -p PORT to change the port)</code></pre>
           <p>Or serve the <code>docs/</code> folder yourself — from the folder run one of:</p>
           <pre><code>python3 -m http.server 8000    # then open http://localhost:8000/
npx serve                      # Node alternative</code></pre>`
        : `<p>Error: <code>${escapeHtml(e.message)}</code></p><p><a href="#/${docId}" data-retry>Try again</a></p>`) +
      `</div>`;
    return;
  }
  if (activeDocId !== docId) return;

  const rendered = renderMarkdown(md);
  // The landing page gets a bespoke hero in place of the plain rendered H1 —
  // the title and tagline it would have shown are already in the hero.
  const isLanding = docId === "README";
  const html = isLanding ? rendered.html.replace(/<h1[^>]*>[\s\S]*?<\/h1>/, "") : rendered.html;
  const htmlWithIds = html.replace(/__DOCID__/g, docId);
  const editUrl = REPO_EDIT_BASE + doc.file;
  const editLink = `<div class="page-edit"><a href="${editUrl}" target="_blank" rel="noopener">` +
    `<svg class="i" aria-hidden="true"><use href="#i-edit"/></svg>Edit this page on GitHub</a></div>`;
  const heroOrBanner = isLanding ? renderHeroMarkup() : renderDocBanner(docId);
  contentEl.innerHTML = heroOrBanner + `<article>${htmlWithIds}${editLink}</article>`;
  renderPageToc(rendered.headings, docId);
  addRunButtons();
  if (isLanding) initHero();
  finishRender(docId, anchor);
}

function finishRender(docId, anchor) {
  renderedDocId = docId;
  scrollToAnchor(anchor);
  closeSidebar();
  setupScrollSpy();
  if (movedByReader && !anchor && typeof contentEl.focus === "function") {
    try { contentEl.focus({ preventScroll: true }); } catch (e) { /* old browsers */ }
  }
  movedByReader = false;
}

// Give every Domain block on a rendered page a Run and an Explain button, once
// the playground is known to be available. Done here rather than in render.js
// so the renderer's output stays the same whether or not the wasm artifact was
// built — the buttons are a property of the page, not of the Markdown.
function addRunButtons() {
  if (!playgroundReady()) return;
  for (const pre of contentEl.querySelectorAll("pre")) {
    const tag = pre.querySelector(".lang-tag");
    if (!tag || tag.textContent !== "domain") continue;
    if (pre.querySelector("[data-run-block]")) continue;
    // A Run button belongs where pressing it will work, and that is exactly a
    // `run` block: the info string is the page's own promise that this is a
    // whole program with the input shown beneath it, and the Go suite runs
    // every one of them and diffs the output.
    //
    // The rule used to be a keyword heuristic over the block's text, which was
    // wrong in both directions. It put buttons on fragments — a list of four
    // `Domain Expansion:` lines reads exactly like a program — and on whole
    // programs that read a file the browser has no filesystem for, so a reader
    // pressing Run on walkthroughs.md got "" is not an integer every time. It
    // also *withheld* one from the program written without its optional
    // keywords, which is the example that teaches they are optional.
    //
    // Pages whose examples are plain ```domain blocks therefore have no Run
    // buttons. That is not a loss: those buttons could only ever fail. Giving
    // such a page working buttons means giving its examples an ```input block,
    // which is the same thing that makes them testable.
    if (!(pre.dataset.flags || "").split(/\s+/).includes("run")) continue;
    pre.insertAdjacentHTML("beforeend",
      `<button class="explain-btn" type="button" data-run-block data-explain>Explain</button>` +
      `<button class="run-btn" type="button" data-run-block>Run</button>`);
  }
}

// blockContext gathers what a program block needs to actually run: the
// ```input block beneath it, and any ```lib blocks — the stdin and the
// imported libraries the page already shows the reader. Without them, pressing
// Run on a documented example fails on an empty box or a missing import
// instead of reproducing the output printed directly beneath it.
//
// It mirrors docs.Examples on the Go side, including why it stops at the next
// Domain block: without that, a program written without an input would scan on
// and adopt the *next* example's, which fails somewhere other than where the
// mistake is.
function blockContext(pre) {
  const ctx = { input: "", libs: {} };
  for (let el = pre.nextElementSibling; el; el = el.nextElementSibling) {
    if (el.tagName !== "PRE") {
      // Prose may sit between an example and its input; a heading means the
      // example is over.
      if (/^H[1-6]$/.test(el.tagName)) break;
      continue;
    }
    const tag = el.querySelector(".lang-tag")?.textContent;
    if (tag === "domain") break;
    const text = () => el.querySelector("code")?.innerText ?? "";
    if (tag === "input") ctx.input = text();
    // ```lib aoc.domain — the path rides in the info string, which reaches the
    // DOM as data-flags. The `.domain` suffix is dropped because the module
    // keys its virtual filesystem by the target *as written in the program*
    // ("Innate Domain: aoc"), which is also how gallery.json stores them; the
    // block names a filename because the Go harness writes a real file.
    if (tag === "lib") {
      const path = (el.dataset.flags || "").split(/\s+/)[0];
      if (path) ctx.libs[path.replace(/\.domain$/, "")] = text();
    }
  }
  return ctx;
}

// Scroll to the requested anchor, or to the top when there isn't one.
function scrollToAnchor(anchor) {
  requestAnimationFrame(() => {
    if (anchor) {
      const target = document.getElementById(anchor);
      if (target) { target.scrollIntoView(); return; }
    }
    // Only the window scrolls. This also called main.scrollIntoView(), which
    // moved the browser's Tab starting point into the article, so the first
    // Tab on any page skipped the skip link, the header and the navigation.
    window.scrollTo(0, 0);
  });
}

// ---- The generated pages ----------------------------------------------
async function renderGalleryPage(doc) {
  const [all] = await Promise.all([fetchGallery(), probePlayground()]);
  const programs = all.filter(p => p.group === doc.galleryGroup);
  if (!programs.length) {
    return { html: `<h1>${escapeHtml(doc.title)}</h1><div class="error-box">` +
      `<p>Couldn't load <code>gallery.json</code>, so there is nothing to show here.</p>` +
      `<p>It is generated from the repository: <code>go test ./docs -update</code>.</p></div>`, headings: [] };
  }
  // Counted from the data rather than written out: this said "Nineteen" for as
  // long as there had been more than nineteen, and a number word in prose is
  // exactly the kind of thing nobody re-checks while editing the sentence.
  const intro = doc.galleryGroup === "examples"
    ? `<p>${programs.length} small, self-contained programs. Each one is run against its own input in both optimizer modes and checked against the exact output below, so none of them can quietly rot.</p>`
    : `<p>${programs.length} classic programming problems — FizzBuzz through Game of Life — written as pipelines. Same golden testing as the examples.</p>`;
  const rendered = renderGallery(programs, { runnable: playgroundReady() });
  return {
    html: `<h1>${escapeHtml(doc.title)}</h1>${intro}${rendered.html}`,
    headings: rendered.headings,
  };
}

async function renderPrimitiveIndexPage(doc) {
  const entries = await fetchPrimitives();
  if (!entries.length) {
    return { html: `<h1>${escapeHtml(doc.title)}</h1><div class="error-box">` +
      `<p>Couldn't load <code>primitives.json</code>.</p>` +
      `<p>It is generated from the primitive catalog: <code>go test ./docs -update</code>.</p></div>`, headings: [] };
  }
  const body = renderPrimitiveIndex(entries, "");
  const html = `<h1>${escapeHtml(doc.title)}</h1>` +
    `<p>Every primitive in the vocabulary, grouped by the themed keyword that decides where in a pipeline it can appear. ` +
    `Filter by name, type or description; each one links into the <a href="#/primitives" data-route>full reference</a>.</p>` +
    `<div class="prim-filter" role="search"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="primFilter" placeholder="Filter ${entries.length} primitives — try “grid”, “List&lt;Int&gt;”, “sort”" aria-label="Filter primitives by name, type or description" aria-controls="primBody" autocomplete="off" spellcheck="false"></div>` +
    `<p class="prim-count" id="primCount" aria-live="polite">${entries.length} primitives</p>` +
    `<div id="primBody">${body.html}</div>`;
  return {
    html, headings: body.headings,
    // Filtering re-renders the table in place; the right-rail TOC is left
    // alone, since a filter that empties it would leave the reader with no
    // way back to the full list.
    afterRender: () => {
      const input = document.getElementById("primFilter");
      const bodyEl = document.getElementById("primBody");
      const countEl = document.getElementById("primCount");
      if (!input || !bodyEl) return;
      // Escape empties the filter before it does anything else, so the
      // full table is one key away.
      input.addEventListener("keydown", e => {
        if (e.key === "Escape" && input.value) { e.stopPropagation(); input.value = ""; input.dispatchEvent(new Event("input")); }
      });
      input.addEventListener("input", () => {
        const out = renderPrimitiveIndex(entries, input.value);
        bodyEl.innerHTML = out.html.replace(/__DOCID__/g, doc.id);
        countEl.textContent = input.value.trim()
          ? `${out.shown} of ${entries.length} primitives`
          : `${entries.length} primitives`;
      });
    },
  };
}

// Scroll spy for right-rail TOC
let scrollSpyHandler = null;
function setupScrollSpy() {
  if (scrollSpyHandler) window.removeEventListener("scroll", scrollSpyHandler);
  const links = [...pageTocEl.querySelectorAll("a")];
  if (!links.length) return;
  const targets = links.map(a => ({ a, el: document.getElementById(a.dataset.slug) })).filter(t => t.el);
  scrollSpyHandler = () => {
    let current = null;
    for (const t of targets) {
      if (t.el.getBoundingClientRect().top <= 120) current = t;
    }
    links.forEach(a => a.classList.remove("active"));
    if (current) current.a.classList.add("active");
  };
  window.addEventListener("scroll", scrollSpyHandler, { passive: true });
  scrollSpyHandler();
}

// ============================================================
//  Playground — the language compiled to WebAssembly
// ============================================================
// The whole front end (lexer, parser, resolver, optimizer, interpreter) is
// pure Go with no dependencies, so it compiles to js/wasm unchanged and runs
// the reader's program in the browser rather than on a server. That choice is
// what makes Run safe to offer at all: there is no filesystem to read, so
// `Cursed Energy: input.txt` falls through to the input box exactly as it
// falls through to stdin on a terminal, and a runaway program is killed by
// terminating the worker — something a server-side runner cannot do to a
// goroutine.
//
// The artifact is built separately (docs/wasm/build.sh) and is not committed,
// so the site has to work without it: everything below degrades to a note
// explaining how to build it, and the Run buttons simply do not appear.
const WASM_URL = "wasm/domain.wasm";
const PLAYGROUND_TIMEOUT_MS = 5000;

const playground = {
  state: "unknown",   // unknown | loading | ready | absent
  worker: null,
  seq: 0,
  pending: new Map(),
};

function playgroundReady() { return playground.state === "ready"; }

// probePlayground checks for the artifact once, without downloading five
// megabytes of it: a one-byte range request is enough to know whether the Run
// buttons should be offered at all. (A HEAD would do the same, but Chromium
// aborts the body it is never sent and logs a failed request for it, which
// looks like a broken site to anyone with devtools open.)
async function probePlayground() {
  if (playground.state !== "unknown") return playground.state;
  playground.state = "loading";
  try {
    const res = await fetch(WASM_URL, { headers: { Range: "bytes=0-0" }, cache: "no-cache" });
    // 206 for a server that honours the range, 200 for one that ignores it.
    playground.state = res.ok ? "ready" : "absent";
    // Read the byte rather than cancelling: an abandoned body is itself
    // reported as a failed request. A server that ignored the range would
    // hand back the whole module, so only drain the partial response.
    if (res.status === 206) await res.arrayBuffer();
    else if (res.body && res.body.cancel) res.body.cancel();
  } catch (e) {
    playground.state = "absent";
  }
  return playground.state;
}

// startWorker boots the runner. Each run gets its own worker so a timeout can
// terminate it outright — the only reliable way to stop a Go program that has
// stopped cooperating.
function startWorker() {
  if (playground.worker) return playground.worker;
  const w = new Worker("wasm/runner.js");
  w.onmessage = e => {
    const { id, ok, result, error } = e.data || {};
    const entry = playground.pending.get(id);
    if (!entry) return;
    playground.pending.delete(id);
    clearTimeout(entry.timer);
    ok ? entry.resolve(result) : entry.reject(new Error(error || "run failed"));
  };
  w.onerror = e => {
    for (const [, entry] of playground.pending) {
      clearTimeout(entry.timer);
      entry.reject(new Error(e.message || "the playground worker failed to start"));
    }
    playground.pending.clear();
    killWorker();
  };
  playground.worker = w;
  return w;
}

function killWorker() {
  if (playground.worker) { playground.worker.terminate(); playground.worker = null; }
}

// runProgram sends one program to the worker and resolves with
// { output, explain, error }. On timeout the worker is terminated, so an
// infinite loop costs one worker rather than the tab.
function runProgram(source, input, opts) {
  const libs = (opts && opts.libs) || {};
  const w = startWorker();
  const id = ++playground.seq;
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      playground.pending.delete(id);
      killWorker();
      reject(new Error(`timed out after ${PLAYGROUND_TIMEOUT_MS / 1000}s — the program was stopped`));
    }, PLAYGROUND_TIMEOUT_MS);
    playground.pending.set(id, { resolve, reject, timer });
    w.postMessage({ id, source, input, libs, explain: !!(opts && opts.explain), optimize: !(opts && opts.optimize === false) });
  });
}

// The note shown wherever Run would be, when the artifact was never built.
function playgroundMissingNote() {
  return `<div class="pg-unavailable"><strong>The playground isn't built.</strong> ` +
    `It is a separate WebAssembly artifact, not committed to the repository. Build it with:` +
    `<pre><code>./docs/wasm/build.sh</code></pre>` +
    `then reload this page. Everything else on the site works without it.</div>`;
}

// The thesis of the language in seven lines: a named algorithm is a request,
// and Explain shows the optimizer answering it with a different one.
const PLAYGROUND_STARTER = `Cursed Energy: input.txt
Cursed Technique: Split Text by "\\n\\n"
Cursed Technique: Split Each by "\\n"
Channeled Energy: Convert Each List to Integers
Maximum Technique: Sum Each Group
Domain Expansion: Quicksort, Descending
Maximum Technique: Select Top 3, Sum
Reveal: stdout`;
const PLAYGROUND_STARTER_INPUT = "1000\n2000\n3000\n\n4000\n\n5000\n6000\n\n7000\n8000\n9000\n\n10000";

const MOD_KEY = /Mac|iPhone|iPad/.test((typeof navigator !== "undefined" && navigator.platform) || "") ? "⌘" : "Ctrl";

function renderPlaygroundPage(doc) {
  const html = `<h1>${escapeHtml(doc.title)}</h1>` +
    `<p>The language runs here, in this tab — the same lexer, parser, resolver, optimizer and interpreter the ` +
    `<code>domain</code> binary uses, compiled to WebAssembly. Nothing is sent anywhere.</p>` +
    `<p><code>Cursed Energy: input.txt</code> reads the input box: on a terminal a missing input file falls back to stdin, ` +
    `and in the browser there is no filesystem at all, so every program falls back the same way.</p>` +
    `<div id="pgHost"><div class="loading skeleton" role="status" aria-label="Checking for the playground"><i></i><i></i><i></i></div></div>`;
  return {
    html, headings: [],
    afterRender: async () => {
      const host = document.getElementById("pgHost");
      if (!host) return;
      if (await probePlayground() !== "ready") { host.innerHTML = playgroundMissingNote(); return; }
      host.innerHTML =
        `<div class="pg-shell">
          <div class="pg-bar" role="toolbar" aria-label="Playground">
            <button class="pg-run" type="button" id="pgRun" aria-describedby="pgRunHint">` +
              `<svg class="i" aria-hidden="true" style="width:14px;height:14px"><use href="#i-play"/></svg>Run` +
              `<kbd id="pgRunHint" aria-label="shortcut ${MOD_KEY} Enter">${MOD_KEY} ↵</kbd></button>
            <button class="btn" type="button" id="pgExplain" title="Run, and show what the optimizer rewrote">Explain</button>
            <button class="btn" type="button" id="pgReset" title="Put back the program and input this one started with">` +
              `<svg class="i" aria-hidden="true"><use href="#i-reset"/></svg>Reset</button>
            <select id="pgLoad" aria-label="Load a program from the gallery">
              <option value="">Load a program…</option>
            </select>
            <span class="pg-spacer"></span>
            <span class="pg-status" id="pgStatus" role="status" aria-live="polite"></span>
          </div>
          <div class="pg-grid">
            <div class="pg-pane">
              <label for="pgSource">Program</label>
              <textarea id="pgSource" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea>
            </div>
            <div class="pg-pane">
              <label for="pgInput">Input <span style="text-transform:none;letter-spacing:0;font-weight:500">(stdin)</span></label>
              <textarea id="pgInput" class="pg-input" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea>
            </div>
          </div>
          <div class="pg-out" id="pgOut"><div class="run-output"><div class="ro-empty">Press <strong>Run</strong> (${MOD_KEY}+Enter) to see the output here, or <strong>Explain</strong> to see which algorithms the optimizer chose.</div></div></div>
        </div>`;
      const srcEl = document.getElementById("pgSource");
      const inEl = document.getElementById("pgInput");
      const outEl = document.getElementById("pgOut");
      // Reset returns to whatever was last loaded — the starter, or the
      // gallery program picked from the list.
      let origin = { source: PLAYGROUND_STARTER, input: PLAYGROUND_STARTER_INPUT, libs: {} };
      const load = o => { origin = o; srcEl.value = o.source; inEl.value = o.input; };
      load(origin);

      // Every gallery program is loadable, so the playground doubles as the
      // place to take one apart.
      const sel = document.getElementById("pgLoad");
      fetchGallery().then(all => {
        const groups = {};
        for (const p of all) (groups[p.group] = groups[p.group] || []).push(p);
        for (const [g, progs] of Object.entries(groups)) {
          const og = document.createElement("optgroup");
          og.label = g[0].toUpperCase() + g.slice(1);
          for (const p of progs) {
            const opt = document.createElement("option");
            opt.value = p.id;
            opt.textContent = p.title.split(" — ")[0];
            og.appendChild(opt);
          }
          sel.appendChild(og);
        }
        sel.addEventListener("change", async () => {
          const prog = (await fetchGallery()).find(p => p.id === sel.value);
          if (!prog) return;
          load({ source: prog.source, input: prog.input || "", libs: prog.libs || {} });
          outEl.innerHTML = "";
          setStatus(`Loaded ${prog.group}/${prog.id}`);
        });
      });

      const statusEl = document.getElementById("pgStatus");
      const setStatus = t => { statusEl.textContent = t; };
      const runBtn = document.getElementById("pgRun");
      const explainBtn = document.getElementById("pgExplain");
      const go = async explain => {
        if (runBtn.disabled) return;
        runBtn.disabled = explainBtn.disabled = true;
        try {
          await runInto(outEl, srcEl.value, inEl.value, { explain, libs: origin.libs }, statusEl);
        } finally {
          runBtn.disabled = explainBtn.disabled = false;
        }
      };
      runBtn.addEventListener("click", () => go(false));
      explainBtn.addEventListener("click", () => go(true));
      document.getElementById("pgReset").addEventListener("click", () => {
        load(origin);
        outEl.innerHTML = "";
        setStatus("Reset");
        srcEl.focus();
      });
      // Ctrl/Cmd+Enter runs, the shortcut every editor-shaped box should have.
      for (const el of [srcEl, inEl]) {
        el.addEventListener("keydown", e => {
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); go(e.shiftKey); }
        });
      }
    },
  };
}

// runOutputHead is the strip above a result: what it is, how long it took,
// and the two things a reader does with one — copy it, or dismiss it.
function runOutputHead(title, ms) {
  return `<div class="ro-head"><span class="ro-title">${title}</span>` +
    (ms != null ? `<span class="ro-time">${ms} ms</span>` : "") +
    `<span class="ro-actions">` +
    `<button type="button" data-copy-output aria-label="Copy output">Copy</button>` +
    `<button type="button" data-close-output aria-label="Dismiss output">✕</button></span></div>`;
}

// runInto executes a program and renders the result into `host`. Shared by the
// playground page, the gallery cards and the Run buttons on code blocks.
async function runInto(host, source, input, opts, statusEl) {
  if (!host) return;
  const setStatus = t => { if (statusEl) statusEl.textContent = t; };
  // The first run also boots the WebAssembly module, which is most of the
  // wait; say so rather than leave a bare spinner.
  const cold = !playground.worker;
  const msg = cold ? "Starting the runtime…" : "Running…";
  host.innerHTML = `<div class="run-output is-running" aria-busy="true"><div class="ro-head">` +
    `<span class="spinner" aria-hidden="true"></span><span class="ro-title">${msg}</span></div></div>`;
  setStatus(cold ? "starting the runtime…" : "running…");
  const started = performance.now();
  try {
    const res = await runProgram(source, input, opts);
    const ms = Math.round(performance.now() - started);
    const failed = !!res.error;
    setStatus(failed ? `failed · ${ms} ms` : `done · ${ms} ms`);
    let body = "";
    if (res.explain && res.explain.length) {
      body += `<pre class="ro-explain"><code>${escapeHtml(res.explain.join("\n"))}</code></pre>`;
    }
    body += `<pre><code data-output>${escapeHtml(failed ? res.error : (res.output || "(no output)"))}</code></pre>`;
    host.innerHTML = `<div class="run-output${failed ? " is-error" : ""}" role="region" aria-label="${failed ? "Error" : "Output"}">` +
      runOutputHead(failed ? "Error" : "Output", ms) + body + `</div>`;
  } catch (e) {
    setStatus("stopped");
    host.innerHTML = `<div class="run-output is-error" role="region" aria-label="Error">` + runOutputHead("Error", null) +
      `<pre><code data-output>${escapeHtml(e.message)}</code></pre></div>`;
  }
}

// Dismissing or copying a result, and the Run buttons that appear on gallery
// cards and on runnable code blocks — delegated, so blocks rendered after
// navigation work.
document.addEventListener("click", async e => {
  const close = e.target.closest("[data-close-output]");
  if (close) { const box = close.closest(".run-output"); if (box) box.remove(); return; }

  const copyOut = e.target.closest("[data-copy-output]");
  if (copyOut) {
    const code = copyOut.closest(".run-output").querySelector("[data-output]");
    try { await navigator.clipboard.writeText(code ? code.textContent : ""); copyOut.textContent = "Copied"; }
    catch (err) { copyOut.textContent = "Select & copy"; }
    setTimeout(() => { copyOut.textContent = "Copy"; }, 1400);
    return;
  }

  const trigger = e.target.closest("[data-run-program], [data-run-block]");
  if (!trigger || trigger.disabled) return;
  trigger.disabled = true;
  try {
    if (trigger.hasAttribute("data-run-program")) {
      const id = trigger.getAttribute("data-run-program");
      const prog = (await fetchGallery()).find(p => p.id === id);
      if (!prog) return;
      const card = trigger.closest("section.program");
      let out = card.querySelector(".run-host");
      if (!out) {
        out = document.createElement("div");
        out.className = "run-host";
        card.appendChild(out);
      }
      await runInto(out, prog.source, prog.input, { libs: prog.libs });
      return;
    }
    const pre = trigger.closest("pre");
    const code = pre && pre.querySelector("code");
    if (!code) return;
    let out = pre.nextElementSibling;
    if (!out || !out.classList.contains("run-host")) {
      out = document.createElement("div");
      out.className = "run-host";
      pre.after(out);
    }
    const ctx = blockContext(pre);
    await runInto(out, code.innerText, ctx.input,
      { explain: trigger.hasAttribute("data-explain"), libs: ctx.libs });
  } finally {
    trigger.disabled = false;
  }
});

// ============================================================
//  Search UI
// ============================================================
const overlay = document.getElementById("searchOverlay");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
const searchStatus = document.getElementById("searchStatus");
const scopeBtn = document.getElementById("scopeBtn");
const searchCloseBtn = document.getElementById("searchClose");
let selIndex = 0;
let indexReady = false;
let scopedToPage = false;
// What the reader was on before the dialog took focus, so closing it puts them
// back rather than at the top of the document.
let focusBeforeSearch = null;

// ---- Recent searches ----------------------------------------------------
// Kept locally, so a query you ran yesterday is one click away. Private-mode
// storage failures are ignored: the feature is a convenience, not a dependency.
const RECENTS_KEY = "domain-docs-recent-searches";
const MAX_RECENTS = 6;
function readRecents() {
  try {
    const raw = JSON.parse(localStorage.getItem(RECENTS_KEY) || "[]");
    return Array.isArray(raw) ? raw.filter(s => typeof s === "string").slice(0, MAX_RECENTS) : [];
  } catch (e) { return []; }
}
function rememberSearch(q) {
  q = q.trim();
  if (q.length < 2) return;
  const next = [q, ...readRecents().filter(s => s !== q)].slice(0, MAX_RECENTS);
  try { localStorage.setItem(RECENTS_KEY, JSON.stringify(next)); } catch (e) { /* private mode */ }
}
function recentsMarkup() {
  const recents = readRecents();
  if (!recents.length) {
    return '<div class="empty">Start typing to search titles, headings, and full text.</div>';
  }
  return `<div class="search-recents"><div class="rec-label">Recent</div>` +
    recents.map(q => `<button type="button" data-recent="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join("") +
    `</div>`;
}

// ---- Opening and closing ------------------------------------------------
function openSearch(initial) {
  focusBeforeSearch = document.activeElement;
  overlay.classList.add("open");
  if (typeof initial === "string") searchInput.value = initial;
  searchInput.focus();
  searchInput.select();
  renderResults(searchInput.value);
  syncSearchHash(searchInput.value);
}
function closeSearch() {
  if (!overlay.classList.contains("open")) return;
  overlay.classList.remove("open");
  searchInput.setAttribute("aria-expanded", "false");
  // Returning focus is the half of a dialog that is easy to forget and
  // impossible to work around with a keyboard.
  // The element may since have been re-rendered away (the navigation is
  // rebuilt on every route); focus on a detached node goes nowhere and would
  // leave it inside the hidden dialog, so fall back to the search button.
  const back = focusBeforeSearch && focusBeforeSearch.isConnected !== false &&
    focusBeforeSearch !== document.body ? focusBeforeSearch : document.getElementById("sidebarSearch");
  if (back && typeof back.focus === "function") back.focus();
  focusBeforeSearch = null;
  // A deep-linked search leaves #/search?q=… in the address bar; put the page
  // back so Back does not reopen the dialog and a reload lands where the
  // reader actually is.
  if (location.hash.startsWith("#/search")) replaceHash(pageHash());
}

// The page the reader is on, for the "This page" scope filter. It is tracked
// rather than read back out of the hash, because while the dialog is open the
// hash is the search itself — parsing it would scope every search to README.
function currentDocId() { return DOC_BY_ID[activeDocId] ? activeDocId : "README"; }

// Reflect the query in the address bar as it is typed, so the URL can be
// copied and shared. replaceState rather than assignment: this must not fire
// the router or leave a history entry per keystroke.
function syncSearchHash(q) {
  if (!overlay.classList.contains("open")) return;
  replaceHash(q.trim() ? `#/search?q=${encodeURIComponent(q)}` : pageHash());
}

// The hash for the page behind the dialog. Closing the search, or clearing the
// query, restores this rather than dropping the hash altogether — stripping it
// would silently move the reader back to the overview on the next reload.
function pageHash() { return `#/${currentDocId()}`; }

function replaceHash(target) {
  try {
    history.replaceState(null, "", target);
  } catch (e) { /* some sandboxes forbid replaceState; the dialog still works */ }
}

function renderResults(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const setStatus = t => { if (searchStatus) searchStatus.textContent = t; };
  searchInput.setAttribute("aria-expanded", terms.length ? "true" : "false");
  searchInput.removeAttribute("aria-activedescendant");
  if (!terms.length) {
    searchResults.innerHTML = recentsMarkup();
    setStatus("");
    return;
  }
  if (!indexReady) {
    searchResults.innerHTML = '<div class="empty"><span class="spinner"></span>Building search index…</div>';
    setStatus("Building the search index.");
    return;
  }
  const scope = scopedToPage ? currentDocId() : null;
  const pool = scope ? searchIndex.filter(e => e.docId === scope) : searchIndex;
  const results = searchEntries(pool, q);
  selIndex = 0;
  if (!results.length) {
    const where = scope ? ` on ${DOC_BY_ID[scope].title}` : "";
    searchResults.innerHTML = `<div class="empty">No matches for “${escapeHtml(q)}”${escapeHtml(where)}.</div>`;
    setStatus(`No results for ${q}${where}.`);
    return;
  }
  searchResults.innerHTML = results.map((r, i) => {
    const e = r.entry;
    const href = `#/${e.docId}${e.headingSlug ? "#" + e.headingSlug : ""}`;
    return `<a class="result ${i === 0 ? "sel" : ""}" href="${href}" id="search-result-${i}"
      role="option" aria-selected="${i === 0}" data-search-result data-idx="${i}">
      <div class="r-doc">${escapeHtml(e.docTitle)}</div>
      <div class="r-title">${escapeHtml(e.heading)}</div>
      <div class="r-snippet">${makeSnippet(e, terms)}</div>
    </a>`;
  }).join("");
  searchInput.setAttribute("aria-activedescendant", "search-result-0");
  setStatus(`${results.length} result${results.length === 1 ? "" : "s"} for ${q}.`);
}

function moveSelection(delta) {
  const items = [...searchResults.querySelectorAll(".result")];
  if (!items.length) return;
  items[selIndex]?.classList.remove("sel");
  items[selIndex]?.setAttribute("aria-selected", "false");
  selIndex = (selIndex + delta + items.length) % items.length;
  items[selIndex].classList.add("sel");
  items[selIndex].setAttribute("aria-selected", "true");
  items[selIndex].scrollIntoView({ block: "nearest" });
  // Arrow keys move a class; without this the announcement never follows.
  searchInput.setAttribute("aria-activedescendant", items[selIndex].id);
}

function openResult(href) {
  rememberSearch(searchInput.value);
  closeSearch();
  location.hash = href.slice(1);
}

function openSelected() {
  const el = searchResults.querySelectorAll(".result")[selIndex];
  if (el) openResult(el.getAttribute("href"));
}

searchInput.addEventListener("input", e => { renderResults(e.target.value); syncSearchHash(e.target.value); });
searchResults.addEventListener("click", e => {
  const recent = e.target.closest("[data-recent]");
  if (recent) {
    searchInput.value = recent.getAttribute("data-recent");
    searchInput.focus();
    renderResults(searchInput.value);
    return;
  }
  const a = e.target.closest("[data-search-result]");
  if (a) { e.preventDefault(); openResult(a.getAttribute("href")); }
});
searchInput.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveSelection(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSelection(-1); }
  else if (e.key === "Enter") { e.preventDefault(); openSelected(); }
  else if (e.key === "Escape") { closeSearch(); }
});
// A modal dialog owns the Tab key: without this, tabbing walks out of the
// panel into the page behind it, which is still there and still scrollable.
overlay.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const focusable = [searchInput, scopeBtn, searchCloseBtn].filter(el => el && el.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
scopeBtn.addEventListener("click", () => {
  scopedToPage = !scopedToPage;
  scopeBtn.setAttribute("aria-pressed", String(scopedToPage));
  scopeBtn.textContent = scopedToPage ? `On ${navTitle(DOC_BY_ID[currentDocId()])}` : "This page";
  renderResults(searchInput.value);
  searchInput.focus();
});
// A touch screen has no Escape key; the "esc" chip is a real close button.
if (searchCloseBtn) searchCloseBtn.addEventListener("click", () => closeSearch());
overlay.addEventListener("click", e => { if (e.target === overlay) closeSearch(); });
document.getElementById("sidebarSearch").addEventListener("click", () => openSearch());

// Global keyboard shortcuts
document.addEventListener("keydown", e => {
  const el = document.activeElement || {};
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable === true;
  if ((e.key === "/" && !typing) ) { e.preventDefault(); openSearch(); }
  else if ((e.key === "k" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); openSearch(); }
  else if (e.key === "Escape" && overlay.classList.contains("open")) { closeSearch(); }
  else if (e.key === "Escape" && sidebar.classList.contains("open")) { closeSidebar(true); }
});

// ============================================================
//  Sidebar (narrow screens: a drawer under the header)
// ============================================================
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
const menuToggle = document.getElementById("menuToggle");
function openSidebar() {
  sidebar.classList.add("open"); scrim.classList.add("show");
  menuToggle.setAttribute("aria-expanded", "true");
  menuToggle.setAttribute("aria-label", "Close navigation");
  // Land on the current page's entry, so the drawer opens where the reader is.
  const here = sidebar.querySelector("a.doc-link.active") || sidebar.querySelector("a.doc-link");
  if (here) {
    try { here.focus({ preventScroll: true }); } catch (e) { here.focus(); }
    if (typeof here.scrollIntoView === "function") here.scrollIntoView({ block: "center" });
  }
}
// returnFocus is for a dismissal (Escape, the scrim); following a link moves
// focus to the new page instead.
function closeSidebar(returnFocus) {
  const wasOpen = sidebar.classList.contains("open");
  sidebar.classList.remove("open"); scrim.classList.remove("show");
  menuToggle.setAttribute("aria-expanded", "false");
  menuToggle.setAttribute("aria-label", "Open navigation");
  if (wasOpen && returnFocus === true) menuToggle.focus();
}
menuToggle.addEventListener("click", () => {
  sidebar.classList.contains("open") ? closeSidebar(true) : openSidebar();
});
scrim.addEventListener("click", () => closeSidebar(true));

// Intercept in-app links so they use the hash router without full reload jank
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-route]");
  if (a) {
    /* hash navigation handled by browser + hashchange */
    closeSidebar();
    const folded = a.closest(".toc-mobile");
    if (folded) folded.open = false;
  }
  // The skip link targets #content, which the router would read as a page.
  if (e.target.closest("[data-skip]")) {
    e.preventDefault();
    contentEl.focus();
    if (typeof contentEl.scrollIntoView === "function") contentEl.scrollIntoView();
  }
});

window.addEventListener("hashchange", () => { movedByReader = true; return route(); });
// "Try again" on a page that failed to load: the hash is already the page's,
// so following the link would not fire the router.
document.addEventListener("click", e => {
  if (!e.target.closest("[data-retry]")) return;
  e.preventDefault();
  renderedDocId = null;
  route();
});

// ---- Boot ----
// ---- Theme -------------------------------------------------------------
// The OS preference is the default; an explicit choice overrides it in either
// direction and is remembered. Applied before first paint (see the inline
// bootstrap in <head>) so a dark-theme reader never gets a white flash.
const THEME_KEY = "domain-docs-theme";
function currentTheme() {
  const set = document.documentElement.getAttribute("data-theme");
  if (set) return set;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
// persist is false at boot: writing the OS preference back to storage there
// froze it, so a reader who later switched their OS theme never saw the site
// follow. Only an explicit click is remembered.
function applyTheme(t, persist) {
  document.documentElement.setAttribute("data-theme", t);
  if (persist) { try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* private mode */ } }
  const btn = document.getElementById("theme-toggle");
  if (btn) {
    btn.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
    btn.setAttribute("title", btn.getAttribute("aria-label"));
  }
}
function storedTheme() {
  try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
}
document.addEventListener("click", e => {
  if (e.target.closest("#theme-toggle")) applyTheme(currentTheme() === "dark" ? "light" : "dark", true);
});
// With no explicit choice, keep following the OS as it changes.
(function followOsTheme() {
  const mq = matchMedia("(prefers-color-scheme: dark)");
  if (!mq || typeof mq.addEventListener !== "function") return;
  mq.addEventListener("change", ev => { if (!storedTheme()) applyTheme(ev.matches ? "dark" : "light", false); });
})();

// ---- Heading links -----------------------------------------------------
// The ¶ beside a heading was a plain link: clicking it jumped there, and
// getting a shareable URL meant copying from the address bar afterwards.
// Clicking now puts the absolute link on the clipboard and navigates, which is
// what people were doing by hand. Modifier-clicks and middle-clicks are left
// to the browser so "open in new tab" still works.
document.addEventListener("click", async e => {
  const anchor = e.target.closest("a.heading-anchor");
  if (!anchor || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
  const href = anchor.getAttribute("href") || "";
  const absolute = location.origin + location.pathname + location.search + href;
  try {
    await navigator.clipboard.writeText(absolute);
    const was = anchor.textContent;
    anchor.textContent = "copied";
    anchor.style.opacity = "1";
    setTimeout(() => { anchor.textContent = was; anchor.style.opacity = ""; }, 1200);
  } catch (err) {
    // Clipboard access can be refused (no permission, insecure origin). The
    // link still works, which is the behaviour this replaced.
  }
});

// ---- Copy buttons ------------------------------------------------------
// Delegated, so blocks rendered after navigation are covered without rebinding.
document.addEventListener("click", async e => {
  const btn = e.target.closest("button[data-copy]");
  if (!btn) return;
  const code = btn.parentElement.querySelector("code");
  if (!code) return;
  try {
    await navigator.clipboard.writeText(code.innerText);
    btn.textContent = "Copied";
  } catch (err) {
    btn.textContent = "Press ⌘C";
  }
  btn.classList.add("copied");
  setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1400);
});

// ---- Build stamp -------------------------------------------------------
// The documentation is embedded in the binary, so when the binary is serving
// it the two are necessarily the same build — worth stating on a site whose
// discipline is that the reference describes the code that exists. Served
// statically there is nothing to report, and the panel stays hidden.
async function showBuildStamp() {
  const el = document.getElementById("buildStamp");
  if (!el) return;
  let info;
  try {
    const res = await fetch("build.json", { cache: "no-store" });
    if (!res.ok) return;
    info = await res.json();
  } catch (e) { return; }
  if (!info || !info.version) return;

  const short = info.revision ? info.revision.slice(0, 12) : "";
  // Go appends "+dirty" to the pseudo-version of a modified tree; the badge
  // below says the same thing more legibly, so it is not printed twice.
  const version = info.version.replace(/\+dirty$/, "");
  let html = `Serving from <code>${escapeHtml(version)}</code>`;
  if (short) {
    html += `<br>commit <code>${escapeHtml(short)}</code>`;
    if (info.modified) html += ` <span class="dirty" title="built from a working tree with uncommitted changes">+dirty</span>`;
  }
  if (info.time) html += `<br>${escapeHtml(info.time.slice(0, 10))}`;
  if (info.go) html += ` · ${escapeHtml(info.go)}`;
  el.innerHTML = html;
  el.hidden = false;
}

(async function boot() {
  applyTheme(currentTheme(), false);
  showBuildStamp();
  // Whether the playground was built decides whether Run buttons appear, so
  // settle it before the first page renders.
  await probePlayground();
  route();
  await loadAllForIndex();
  indexReady = true;
  if (overlay.classList.contains("open")) renderResults(searchInput.value);
})();
</script>
