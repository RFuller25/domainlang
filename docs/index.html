<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f6f7f9;

    --mark: #fde68a;

    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;

  @media (prefers-color-scheme: dark) {

      --bg: #14161c;
      --bg-alt: #1b1e26;
      --bg-code: #1e2129;
      --sidebar-bg: #17191f;
      --text: #dfe3ea;
      --text-muted: #9aa3b2;
      --border: #2a2e38;
      --accent: #a78bfa;
      --accent-soft: #2a2440;
      --accent-text: #c4b5fd;
      --mark: #6b5a12;
      --mark-text: #fdf3c8;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; }
  :root[data-theme="dark"] {
    --bg: #14161c;
    --bg-alt: #1b1e26;
    --bg-code: #1e2129;
    --sidebar-bg: #17191f;
    --text: #dfe3ea;
    --text-muted: #9aa3b2;
    --border: #2a2e38;
    --accent: #a78bfa;
    --accent-soft: #2a2440;
    --accent-text: #c4b5fd;
    --mark: #6b5a12;
    --mark-text: #fdf3c8;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    color: var(--text);
    background: var(--bg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-text); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .layout { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    width: 280px;
    flex: 0 0 280px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    padding: 22px 18px 40px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .brand h1 { font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; }
  .brand .badge {
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--accent-text); background: var(--accent-soft);
    padding: 2px 7px; border-radius: 20px; font-weight: 600;
  }
  .tagline { color: var(--text-muted); font-size: 0.82rem; margin: 0 0 16px; }

  .search-box { position: relative; margin-bottom: 18px; }
  .search-box input {
    width: 100%;
    padding: 9px 12px 9px 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
    font-family: var(--sans);
  }
  .search-box input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .search-box .icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); pointer-events: none; font-size: 0.9rem;
  }
  .search-box .kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 0.68rem; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px;
    pointer-events: none; background: var(--bg-alt);
  }

  nav.toc-nav { font-size: 0.9rem; }
  nav.toc-nav .group-label {
    text-transform: uppercase; font-size: 0.66rem; letter-spacing: 0.09em;
    color: var(--text-muted); font-weight: 700; margin: 18px 0 6px; padding-left: 4px;
  }
  nav.toc-nav a.doc-link {
    display: block; padding: 6px 10px; border-radius: 7px; color: var(--text);
    margin-bottom: 1px;
  }
  nav.toc-nav a.doc-link:hover { background: var(--bg-alt); text-decoration: none; }
  nav.toc-nav a.doc-link.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  nav.toc-nav .doc-link .desc {
    display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 400; margin-top: 1px;
  }
  nav.toc-nav a.doc-link.active .desc { color: var(--accent-text); opacity: 0.8; }

  /* Main */
  .main-wrap { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; }
  main {
    max-width: 820px; width: 100%; padding: 40px 48px 120px;
  }

  /* Page TOC (right rail) */
  .page-toc {
    flex: 0 0 220px; padding: 48px 20px; position: sticky; top: 0; height: 100vh;
    overflow-y: auto; font-size: 0.82rem;
  }
  .page-toc .label {
    text-transform: uppercase; font-size: 0.64rem; letter-spacing: 0.09em;
    color: var(--text-muted); font-weight: 700; margin-bottom: 10px;
  }
  .page-toc a { display: block; color: var(--text-muted); padding: 3px 0; border-left: 2px solid transparent; padding-left: 10px; }
  .page-toc a:hover { color: var(--text); text-decoration: none; }
  .page-toc a.h3 { padding-left: 22px; font-size: 0.78rem; }
  .page-toc a.active { color: var(--accent-text); border-left-color: var(--accent); font-weight: 600; }

  @media (max-width: 1180px) { .page-toc { display: none; } }
  @media (max-width: 860px) {
    .sidebar {
      position: fixed; z-index: 50; transform: translateX(-100%);
      transition: transform 0.2s ease; box-shadow: var(--shadow);
    }
    .sidebar.open { transform: translateX(0); }
    main { padding: 24px 20px 100px; }
    .menu-toggle { display: inline-flex !important; }
    .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; }
    .scrim.show { display: block; }
  }
  .menu-toggle {
    display: none; position: fixed; top: 14px; left: 14px; z-index: 60;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    width: 40px; height: 40px; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text); box-shadow: var(--shadow); font-size: 1.1rem;
  }

  /* Markdown content */
  article h1, article h2, article h3, article h4 {
    line-height: 1.25; letter-spacing: -0.01em; scroll-margin-top: 20px;
  }
  article h1 { font-size: 2rem; margin: 0 0 0.5em; }
  article h2 { font-size: 1.45rem; margin: 1.8em 0 0.6em; padding-bottom: 0.25em; border-bottom: 1px solid var(--border); }
  article h3 { font-size: 1.15rem; margin: 1.5em 0 0.5em; }
  article h4 { font-size: 1rem; margin: 1.3em 0 0.4em; }
  article p { margin: 0 0 1em; }
  article ul, article ol { margin: 0 0 1em; padding-left: 1.5em; }
  article li { margin: 0.25em 0; }
  article blockquote {
    margin: 0 0 1em; padding: 0.4em 1.1em; border-left: 3px solid var(--accent);
    background: var(--bg-alt); color: var(--text-muted); border-radius: 0 8px 8px 0;
  }
  article blockquote p:last-child { margin-bottom: 0; }
  article code {
    font-family: var(--mono); font-size: 0.86em; background: var(--bg-code);
    padding: 0.15em 0.4em; border-radius: 5px; border: 1px solid var(--border);
  }
  article pre {
    background: var(--bg-code); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; overflow-x: auto; margin: 0 0 1.2em; line-height: 1.5;
  }
  article pre code { background: none; border: none; padding: 0; font-size: 0.85em; }
  article pre .lang-tag {
    display: block; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin-bottom: 8px; font-family: var(--sans);
  }
  article pre { position: relative; }
  article pre .copy-btn {
    position: absolute; top: 8px; right: 8px; padding: 3px 9px;
    font: 600 0.68rem/1.5 var(--sans); color: var(--text-muted);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; opacity: 0; transition: opacity 0.12s ease, color 0.12s ease;
  }
  article pre:hover .copy-btn, article pre .copy-btn:focus-visible { opacity: 1; }
  article pre .copy-btn:hover { color: var(--accent-text); border-color: var(--accent); }
  article pre .copy-btn.copied { color: var(--accent-text); border-color: var(--accent); opacity: 1; }

  /* Domain syntax highlighting (see highlightDomain in render.js). Tuned to
     stay legible in both themes: these are the only colours in the article
     body, so they carry meaning rather than decoration. */
  .tok-kw      { color: var(--accent-text); font-weight: 600; }
  .tok-arg     { color: #0e7490; }
  .tok-str     { color: #b45309; }
  .tok-num     { color: #a21caf; }
  .tok-op      { color: var(--text-muted); }
  .tok-comment { color: var(--text-muted); font-style: italic; }
  :root[data-theme="dark"] .tok-arg { color: #67e8f9; }
  :root[data-theme="dark"] .tok-str { color: #fcd34d; }
  :root[data-theme="dark"] .tok-num { color: #f0abfc; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .tok-arg { color: #67e8f9; }
    :root:not([data-theme="light"]) .tok-str { color: #fcd34d; }
    :root:not([data-theme="light"]) .tok-num { color: #f0abfc; }
  }

  /* A heading's stable short anchor: an empty target placed just above it, so
     "#window" keeps working when the signature in the heading changes. */
  article a.heading-alias { display: block; height: 0; scroll-margin-top: 20px; }

  .brand #theme-toggle {
    margin-left: auto; width: 28px; height: 28px; padding: 0; line-height: 1;
    font-size: 0.95rem; color: var(--text-muted); background: var(--bg);
    border: 1px solid var(--border); border-radius: 7px; cursor: pointer;
  }
  .brand #theme-toggle:hover { color: var(--accent-text); border-color: var(--accent); }
  .page-edit { margin: 2.5em 0 0; padding-top: 1.2em; border-top: 1px solid var(--border); }
  .page-edit a { font-size: 0.85rem; color: var(--text-muted); }
  .page-edit a:hover { color: var(--accent-text); }

  article table {
    border-collapse: collapse; width: 100%; margin: 0 0 1.4em; font-size: 0.9rem; display: block; overflow-x: auto;
  }
  article th, article td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
  article th { background: var(--bg-alt); font-weight: 600; }
  article tr:nth-child(even) td { background: var(--bg-alt); }
  article hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  article a.heading-anchor {
    color: var(--text-muted); opacity: 0; margin-left: 8px; font-weight: 400;
    text-decoration: none; font-size: 0.8em; cursor: pointer;
  }
  article a.heading-anchor:hover { color: var(--accent-text); }
  article h1:hover .heading-anchor, article h2:hover .heading-anchor,
  article h3:hover .heading-anchor, article h4:hover .heading-anchor { opacity: 1; }
  article img { max-width: 100%; }
  mark { background: var(--mark); color: var(--mark-text); border-radius: 3px; padding: 0 2px; }

  .page-nav {
    display: flex; justify-content: space-between; gap: 12px; margin-top: 48px;
    padding-top: 24px; border-top: 1px solid var(--border);
  }
  .page-nav a {
    flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; gap: 2px;
  }
  .page-nav a:hover { border-color: var(--accent); text-decoration: none; background: var(--bg-alt); }
  .page-nav a.next { text-align: right; align-items: flex-end; }
  .page-nav .dir { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .page-nav .ttl { font-weight: 600; color: var(--text); }

  /* Search overlay */
  .search-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(10, 12, 20, 0.45); backdrop-filter: blur(2px);
    padding-top: 10vh;
  }
  .search-overlay.open { display: block; }
  .search-panel {
    max-width: 640px; margin: 0 auto; background: var(--bg); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
  }
  .search-panel .search-input-row {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .search-panel input {
    flex: 1; border: none; background: none; color: var(--text); font-size: 1.05rem;
    font-family: var(--sans); outline: none;
  }
  .search-panel .close-hint { font-family: var(--mono); font-size: 0.7rem; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; }
  .search-results { max-height: 60vh; overflow-y: auto; padding: 6px; }
  .search-results .empty { padding: 30px 20px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
  .result {
    display: block; padding: 12px 14px; border-radius: 9px; cursor: pointer; color: var(--text);
  }
  .result:hover, .result.sel { background: var(--accent-soft); text-decoration: none; }
  .result .r-doc { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-text); font-weight: 600; }
  .result .r-title { font-weight: 600; margin: 2px 0; }
  .result .r-snippet { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .result mark { font-weight: 600; }
  .search-foot {
    display: flex; gap: 16px; padding: 8px 18px; border-top: 1px solid var(--border);
    font-size: 0.72rem; color: var(--text-muted);
  }
  .search-foot kbd { font-family: var(--mono); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }

  /* Present to screen readers, invisible on screen — the search dialog's own
     name, and the live region that announces how many results there are. */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .search-panel .scope-btn {
    flex: none; padding: 3px 10px; font: 600 0.7rem/1.5 var(--sans); cursor: pointer;
    color: var(--text-muted); background: var(--bg-alt); border: 1px solid var(--border);
    border-radius: 20px;
  }
  .search-panel .scope-btn:hover { color: var(--accent-text); border-color: var(--accent); }
  .search-panel .scope-btn[aria-pressed="true"] {
    color: var(--accent-text); background: var(--accent-soft); border-color: var(--accent);
  }
  .search-recents { padding: 10px 14px 14px; }
  .search-recents .rec-label {
    font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); font-weight: 700; margin-bottom: 8px;
  }
  .search-recents button {
    font: 500 0.82rem/1.5 var(--sans); color: var(--text); background: var(--bg-alt);
    border: 1px solid var(--border); border-radius: 20px; padding: 3px 12px;
    margin: 0 6px 6px 0; cursor: pointer;
  }
  .search-recents button:hover { color: var(--accent-text); border-color: var(--accent); }

  /* ---- Program gallery (examples / challenges) ---- */
  article .program { margin: 0 0 2.6em; }
  article .program h2 { margin-top: 1.6em; }
  .program-meta { display: flex; align-items: center; gap: 10px; margin: 0 0 0.8em; flex-wrap: wrap; }
  .program-meta code { font-size: 0.78rem; color: var(--text-muted); }
  .program-desc { color: var(--text-muted); }
  .program-io { margin: 0 0 1em; }
  .program-io summary {
    cursor: pointer; font-size: 0.8rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; padding: 4px 0;
  }
  .program-io summary:hover { color: var(--accent-text); }
  .program-io pre, .program-out pre { margin-top: 0.5em; }
  .io-label {
    display: block; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); font-weight: 700; margin-bottom: 4px;
  }
  .program-out pre { border-left: 3px solid var(--accent); }

  /* Run / Explain, on gallery cards and on runnable code blocks alike */
  .run-btn, .explain-btn {
    padding: 3px 11px; font: 600 0.72rem/1.6 var(--sans); cursor: pointer;
    color: var(--accent-text); background: var(--bg); border: 1px solid var(--accent);
    border-radius: 6px;
  }
  .run-btn:hover, .explain-btn:hover { background: var(--accent-soft); }
  .run-btn[disabled], .explain-btn[disabled] { opacity: 0.5; cursor: default; }
  .explain-btn { color: var(--text-muted); border-color: var(--border); }
  article pre .run-btn, article pre .explain-btn {
    position: absolute; top: 8px; opacity: 0; transition: opacity 0.12s ease;
  }
  article pre .run-btn { right: 62px; }
  article pre .explain-btn { right: 116px; }
  article pre:hover .run-btn, article pre:hover .explain-btn,
  article pre .run-btn:focus-visible, article pre .explain-btn:focus-visible { opacity: 1; }
  .run-output {
    margin: -0.8em 0 1.2em; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-alt); overflow: hidden;
  }
  .run-output .ro-head {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    border-bottom: 1px solid var(--border); font-size: 0.68rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted);
  }
  .run-output .ro-head .ro-close { margin-left: auto; cursor: pointer; border: none; background: none;
    color: var(--text-muted); font-size: 0.9rem; padding: 0 4px; }
  .run-output pre { margin: 0; border: none; border-radius: 0; background: none; }
  .run-output.is-error .ro-head { color: #d9534f; }
  .run-output.is-error pre code { color: #d9534f; }
  .run-output .ro-explain { color: var(--accent-text); }
  .run-ok { color: #16a34a; }
  :root[data-theme="dark"] .run-ok { color: #4ade80; }

  /* ---- Primitive index ---- */
  .prim-filter { position: relative; margin: 0 0 1.4em; }
  .prim-filter input {
    width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 0.92rem; font-family: var(--sans);
  }
  .prim-filter input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .prim-count { font-size: 0.78rem; color: var(--text-muted); margin: 6px 2px 0; }
  article table.prim-index { font-size: 0.86rem; }
  article table.prim-index td:first-child { white-space: nowrap; }
  article .prim-sig { white-space: nowrap; font-size: 0.82em; }
  .empty-filter { color: var(--text-muted); padding: 24px 0; }

  /* ---- Playground ---- */
  .pg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 0 0 14px; }
  @media (max-width: 760px) { .pg-grid { grid-template-columns: 1fr; } }
  .pg-pane { display: flex; flex-direction: column; min-width: 0; }
  .pg-pane label {
    font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); font-weight: 700; margin-bottom: 5px;
  }
  .pg-pane textarea {
    width: 100%; min-height: 240px; padding: 12px 14px; resize: vertical;
    font-family: var(--mono); font-size: 0.84rem; line-height: 1.5;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-code); color: var(--text); tab-size: 2;
  }
  .pg-pane textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .pg-pane textarea.pg-input { min-height: 240px; }
  .pg-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
  .pg-bar .pg-run {
    padding: 7px 18px; font: 600 0.85rem/1.4 var(--sans); cursor: pointer; color: #fff;
    background: var(--accent); border: 1px solid var(--accent); border-radius: 8px;
  }
  .pg-bar .pg-run:hover { filter: brightness(1.08); }
  .pg-bar .pg-run[disabled] { opacity: 0.55; cursor: default; }
  .pg-bar select, .pg-bar .pg-secondary {
    padding: 6px 10px; font: 500 0.8rem/1.4 var(--sans); color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px; cursor: pointer;
  }
  .pg-bar .pg-status { font-size: 0.78rem; color: var(--text-muted); margin-left: auto; }
  .pg-unavailable {
    padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-alt); color: var(--text-muted); font-size: 0.88rem; margin: 0 0 16px;
  }
  .pg-unavailable code { font-size: 0.85em; }

  /* Which build is serving these pages. Only appears when the site is served
     by the binary, which is the only context that can know. */
  .build-stamp {
    margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--border);
    font-size: 0.7rem; color: var(--text-muted); line-height: 1.5;
  }
  .build-stamp code { font-family: var(--mono); font-size: 0.95em; }
  .build-stamp .dirty { color: #b45309; font-weight: 600; }
  :root[data-theme="dark"] .build-stamp .dirty { color: #fcd34d; }

  .loading, .error-box { padding: 40px; color: var(--text-muted); }
  .error-box { color: #d9534f; }
  .error-box code { background: var(--bg-code); padding: 2px 6px; border-radius: 4px; }
  .spinner {
    display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- JJK technique banners (one per doc, all different) ---- */
  .jjk-banner {
    position: relative; overflow: hidden; height: 72px; margin: 0 0 24px;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg-alt);
    background: linear-gradient(135deg, color-mix(in srgb, var(--jjk-c) 16%, var(--bg-alt)), var(--bg-alt));
    display: flex; align-items: center; gap: 18px; padding: 0 22px;
  }
  .jjk-fx { position: relative; width: 84px; height: 48px; flex: none; }
  .jjk-banner .jjk-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .jjk-banner .kanji { font-size: 1.05rem; font-weight: 700; color: var(--jjk-c); letter-spacing: 0.02em; }
  .jjk-banner .name { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text); }
  .jjk-banner .tag { font-size: 0.78rem; color: var(--text-muted); }

  /* 1. README — Infinity: expanding rings */
  .fx-rings i {
    position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border: 2px solid var(--jjk-c); border-radius: 50%; opacity: 0.9;
    animation: jjkRipple 2.4s ease-out infinite;
  }
  .fx-rings i:nth-child(2) { animation-delay: -0.8s; }
  .fx-rings i:nth-child(3) { animation-delay: -1.6s; }
  @keyframes jjkRipple {
    0% { width: 10px; height: 10px; margin: -5px 0 0 -5px; opacity: 0.9; }
    100% { width: 80px; height: 80px; margin: -40px 0 0 -40px; opacity: 0; }
  }

  /* 2. getting-started — Black Flash: synchronized spike burst */
  .fx-flash .core {
    position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    background: var(--jjk-c); border-radius: 50%; animation: jjkCore 0.9s ease-in-out infinite;
    filter: drop-shadow(0 0 6px var(--jjk-c));
  }
  .fx-flash i {
    position: absolute; left: 50%; top: 50%; width: 2px; height: 26px; margin: -13px 0 0 -1px;
    background: var(--jjk-c); transform-origin: center; opacity: 0;
    animation: jjkSpike 0.9s ease-out infinite;
  }
  .fx-flash i:nth-child(2) { --r: 0deg; }
  .fx-flash i:nth-child(3) { --r: 60deg; }
  .fx-flash i:nth-child(4) { --r: 120deg; }
  .fx-flash i:nth-child(5) { --r: 180deg; }
  .fx-flash i:nth-child(6) { --r: 240deg; }
  .fx-flash i:nth-child(7) { --r: 300deg; }
  @keyframes jjkCore { 0%, 100% { transform: scale(0.6); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 1; } }
  @keyframes jjkSpike {
    0% { opacity: 0; transform: rotate(var(--r)) scaleY(0.3); }
    45% { opacity: 1; transform: rotate(var(--r)) scaleY(1); }
    60% { opacity: 0; transform: rotate(var(--r)) scaleY(1.15); }
    100% { opacity: 0; transform: rotate(var(--r)) scaleY(1.15); }
  }

  /* 3. language — Cursed Speech: floating glyphs */
  .fx-speech { overflow: visible; }
  .fx-speech span {
    position: absolute; bottom: 4px; font-weight: 700; font-size: 1rem; color: var(--jjk-c);
    opacity: 0; animation: jjkFloat 3s ease-in infinite;
  }
  .fx-speech span:nth-child(1) { left: 8%; animation-delay: 0s; }
  .fx-speech span:nth-child(2) { left: 42%; animation-delay: -1s; }
  .fx-speech span:nth-child(3) { left: 74%; animation-delay: -2s; }
  @keyframes jjkFloat {
    0% { opacity: 0; transform: translateY(0); }
    15% { opacity: 1; }
    85% { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(-38px); }
  }

  /* 4. primitives — Ten Shadows: marching shikigami */
  .fx-shadows i {
    position: absolute; bottom: 6px; left: -10px; width: 8px; height: 14px;
    background: var(--jjk-c); border-radius: 2px 2px 0 0; opacity: 0.85;
    animation: jjkMarch 2.6s linear infinite;
  }
  .fx-shadows i:nth-child(2) { animation-delay: -0.65s; }
  .fx-shadows i:nth-child(3) { animation-delay: -1.3s; }
  .fx-shadows i:nth-child(4) { animation-delay: -1.95s; }
  @keyframes jjkMarch { 0% { left: -10px; } 100% { left: 90px; } }

  /* 5. expressions — Straw Doll Technique: resonance thread */
  .fx-thread .line {
    position: absolute; left: 0; right: 0; top: 50%; height: 2px;
    background-image: repeating-linear-gradient(90deg, var(--jjk-c) 0 6px, transparent 6px 12px);
    background-size: 24px 2px; animation: jjkStitch 1.4s linear infinite;
  }
  .fx-thread .knot {
    position: absolute; top: 50%; width: 6px; height: 6px; margin-top: -3px;
    border-radius: 50%; background: var(--jjk-c); animation: jjkKnot 2.8s ease-in-out infinite;
  }
  @keyframes jjkStitch { to { background-position: -24px 0; } }
  @keyframes jjkKnot { 0%, 100% { left: 4%; } 50% { left: 90%; } }

  /* 6. aoc-toolbox — Domain Amplification: pulsing dashed ring */
  .fx-amplify .core {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border-radius: 50%; background: var(--jjk-c);
  }
  .fx-amplify .ring {
    position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
    border-radius: 50%; border: 2px dashed var(--jjk-c); animation: jjkAmplify 2.4s ease-in-out infinite;
  }
  @keyframes jjkAmplify {
    0%, 100% { transform: scale(0.8) rotate(0deg); opacity: 0.5; }

  }

  /* 7. data-model — Cursed Energy: flowing particles */
  .fx-particles i {
    position: absolute; left: -6px; top: 50%; width: 6px; height: 6px; margin-top: -3px;
    border-radius: 50%; background: var(--jjk-c); opacity: 0; animation: jjkFlow 2.2s linear infinite;
  }
  .fx-particles i:nth-child(1) { top: 30%; animation-delay: 0s; }
  .fx-particles i:nth-child(2) { top: 45%; animation-delay: -0.55s; }
  .fx-particles i:nth-child(3) { top: 60%; animation-delay: -1.1s; }
  .fx-particles i:nth-child(4) { top: 75%; animation-delay: -1.65s; }
  @keyframes jjkFlow { 0% { left: -6px; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { left: 88px; opacity: 0; } }

  /* 8. match-pattern — Six Eyes: scanning sweep over a grid */
  .fx-scan {
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 10px 10px; border-radius: 8px;
  }
  .fx-scan i {
    position: absolute; top: 0; bottom: 0; left: 0; width: 3px; background: var(--jjk-c);
    box-shadow: 0 0 10px var(--jjk-c); animation: jjkScan 2.4s ease-in-out infinite;
  }
  @keyframes jjkScan { 0%, 100% { left: 0; } 50% { left: 81px; } }

  /* 9. cli — Playful Cloud: streaking projectile */
  .fx-streak i {
    position: absolute; left: -10px; top: 50%; width: 10px; height: 10px; margin-top: -5px;
    border-radius: 50%; background: var(--jjk-c); box-shadow: -16px 0 10px -3px var(--jjk-c);
    animation: jjkStreak 1.5s ease-in infinite;
  }
  @keyframes jjkStreak { 0% { left: -10px; opacity: 0; } 20% { opacity: 1; } 88% { opacity: 1; } 100% { left: 90px; opacity: 0; } }

  /* 10. diagnostics — Reverse Cursed Technique: healing pulse */
  .fx-pulse .glow {
    position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px;
    border-radius: 50%; background: radial-gradient(circle, var(--jjk-c) 0%, transparent 70%);
    opacity: 0.5; animation: jjkHeal 2.6s ease-in-out infinite;
  }
  .fx-pulse .cross {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    animation: jjkHealCore 2.6s ease-in-out infinite;
  }
  .fx-pulse .cross::before, .fx-pulse .cross::after { content: ""; position: absolute; background: var(--jjk-c); border-radius: 2px; }
  .fx-pulse .cross::before { left: 7px; top: 0; width: 2px; height: 16px; }
  .fx-pulse .cross::after { left: 0; top: 7px; width: 16px; height: 2px; }
  @keyframes jjkHeal { 0%, 100% { transform: scale(0.7); opacity: 0.35; } 50% { transform: scale(1.15); opacity: 0.8; } }
  @keyframes jjkHealCore { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  /* 11. tooling — Divine Dogs: two familiars crossing */
  .fx-cross i {
    position: absolute; top: 50%; left: 50%; width: 36px; height: 2px; background: var(--jjk-c);
    opacity: 0; animation: jjkCross 2s ease-in-out infinite;
  }
  .fx-cross i:nth-child(1) { --r: 35deg; animation-delay: 0s; }
  .fx-cross i:nth-child(2) { --r: -35deg; animation-delay: -1s; }
  @keyframes jjkCross {
    0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--r)) translateX(-40px); }
    45% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--r)) translateX(0); }
    55% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--r)) translateX(40px); }
  }

  /* 12. optimizer — Malevolent Shrine: dropping skewers */
  .fx-skewers i {
    position: absolute; top: -20px; width: 2px; height: 20px; background: var(--jjk-c);
    animation: jjkSkewer 1.1s cubic-bezier(0.7, 0, 1, 1) infinite;
  }
  .fx-skewers i:nth-child(1) { left: 10px; animation-delay: 0s; }
  .fx-skewers i:nth-child(2) { left: 26px; animation-delay: -0.15s; }
  .fx-skewers i:nth-child(3) { left: 42px; animation-delay: -0.3s; }
  .fx-skewers i:nth-child(4) { left: 58px; animation-delay: -0.45s; }
  .fx-skewers i:nth-child(5) { left: 74px; animation-delay: -0.6s; }
  @keyframes jjkSkewer {
    0% { top: -20px; opacity: 0; }
    10% { opacity: 1; }
    55% { top: 48px; opacity: 1; }
    65% { opacity: 0; }
    100% { top: 48px; opacity: 0; }
  }

  /* 13. compiler — Domain Expansion: the barrier manifests */
  .fx-expand .barrier {
    position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
    border-radius: 50%; border: 2px solid var(--jjk-c); animation: jjkBarrier 2.8s ease-out infinite;
  }
  .fx-expand .burst {
    position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
    background: var(--jjk-c); border-radius: 50%; animation: jjkBurst 2.8s ease-out infinite;
  }
  @keyframes jjkBarrier {
    0% { width: 8px; height: 8px; margin: -4px 0 0 -4px; opacity: 1; border-radius: 50%; }
    70% { opacity: 0.6; }
    100% { width: 84px; height: 48px; margin: -24px 0 0 -42px; opacity: 0; border-radius: 10px; }
  }
  @keyframes jjkBurst { 0%, 55% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.4); } }

  /* 14. playground — Simple Domain: a dome drawn and held */
  .fx-simple .dome {
    position: absolute; left: 50%; top: 58%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border: 2px solid var(--jjk-c); border-radius: 50%; border-bottom-color: transparent;
    animation: jjkDome 3s ease-in-out infinite;
  }
  .fx-simple .core {
    position: absolute; left: 50%; top: 58%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
    border-radius: 50%; background: var(--jjk-c); animation: jjkCore 3s ease-in-out infinite;
  }
  @keyframes jjkDome {
    0%, 100% { transform: scale(0.55) rotate(0deg); opacity: 0.45; }
    50% { transform: scale(1) rotate(180deg); opacity: 1; }
  }

  /* 15. examples — Curtain: panels dropping to reveal what is inside */
  .fx-curtain i {
    position: absolute; top: 0; width: 5px; height: 100%; background: var(--jjk-c);
    opacity: 0.75; transform-origin: top; animation: jjkCurtain 3s ease-in-out infinite;
  }
  .fx-curtain i:nth-child(1) { left: 6px;  animation-delay: 0s; }
  .fx-curtain i:nth-child(2) { left: 22px; animation-delay: -0.4s; }
  .fx-curtain i:nth-child(3) { left: 38px; animation-delay: -0.8s; }
  .fx-curtain i:nth-child(4) { left: 54px; animation-delay: -1.2s; }
  .fx-curtain i:nth-child(5) { left: 70px; animation-delay: -1.6s; }
  @keyframes jjkCurtain {
    0%, 100% { transform: scaleY(1); opacity: 0.75; }
    50% { transform: scaleY(0.15); opacity: 0.3; }
  }

  /* 16. challenges — Cursed Tool: two crossing slashes */
  .fx-blade i {
    position: absolute; top: 50%; left: 50%; width: 62px; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--jjk-c), transparent);
    animation: jjkSlash 1.8s ease-in-out infinite;
  }
  .fx-blade i:nth-child(1) { --r: 28deg; animation-delay: 0s; }
  .fx-blade i:nth-child(2) { --r: -28deg; animation-delay: -0.9s; }
  @keyframes jjkSlash {
    0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--r)) scaleX(0.2); }
    35% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--r)) scaleX(1); }
    70% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--r)) scaleX(1); }
    100% { opacity: 0; }
  }

  /* 17. primitive-index — Heavenly Restriction: everything bound to one point */
  .fx-bind .knot {
    position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
    border-radius: 50%; background: var(--jjk-c); box-shadow: 0 0 8px var(--jjk-c);
  }
  .fx-bind i {
    position: absolute; left: 50%; top: 50%; width: 30px; height: 1.5px; background: var(--jjk-c);
    transform-origin: left center; opacity: 0.8; animation: jjkBind 2.6s ease-in-out infinite;
  }
  .fx-bind i:nth-child(2) { --r: 20deg;  animation-delay: 0s; }
  .fx-bind i:nth-child(3) { --r: 110deg; animation-delay: -0.65s; }
  .fx-bind i:nth-child(4) { --r: 200deg; animation-delay: -1.3s; }
  .fx-bind i:nth-child(5) { --r: 290deg; animation-delay: -1.95s; }
  @keyframes jjkBind {
    0%, 100% { transform: rotate(var(--r)) scaleX(1); opacity: 0.25; }
    50% { transform: rotate(var(--r)) scaleX(0.3); opacity: 1; }
  }

  /* Six Eyes glow behind the search icon — both sidebar box and the overlay */
  .search-pulse { position: relative; }
  .search-pulse::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border-radius: 50%; border: 1.5px solid var(--accent); opacity: 0.8;

  }
  @keyframes jjkSixEyesPulse {

  }

  @media (max-width: 860px) {
    .jjk-banner { height: 60px; padding: 0 16px; gap: 12px; }
    .jjk-fx { width: 60px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .jjk-banner *, .search-pulse::before { animation: none !important; }

  /* ---- Print ----
     A reference page is worth printing, and everything that makes it navigable
     on screen is noise on paper: the nav is unclickable, the banner is
     decoration, and the buttons do nothing. What matters is that code blocks
     do not get cut off mid-line and that links keep their targets. */
  @media print {
    .sidebar, .page-toc, .menu-toggle, .scrim, .search-overlay,
    .page-nav, .page-edit, .jjk-banner, .copy-btn, .run-btn, .explain-btn,
    .heading-anchor, .build-stamp, .prim-filter { display: none !important; }
    html, body { background: #fff !important; color: #000 !important; }
    .layout { display: block; }
    .main-wrap { display: block; }
    main { max-width: none; padding: 0; }
    article pre, article code {
      background: #f6f6f6 !important; border: 1px solid #ddd !important;
      color: #000 !important;
    }
    /* Long pipelines and type signatures must wrap rather than vanish off the
       right edge — a printed page has no horizontal scrollbar. */
    article pre { white-space: pre-wrap; word-break: break-word; overflow: visible; }
    article table { display: table; width: 100%; }
    article h1, article h2, article h3 { break-after: avoid; page-break-after: avoid; }
    article pre, article table, .program { break-inside: avoid; page-break-inside: avoid; }
    /* A printed link is only useful if you can read where it goes; in-app
       routes are meaningless on paper, so only external ones are expanded. */
    article a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.85em; color: #555; }
    .program-io[open] summary { font-weight: 700; }
    .tok-kw, .tok-arg, .tok-str, .tok-num, .tok-op, .tok-comment { color: #000 !important; }

    .tok-comment { font-style: italic; color: #555 !important; }
  }

// of the wrong theme that a toggle applied after boot would cause.
(function () {
  try {
    const t = localStorage.getItem("domain-docs-theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* private mode: fall back to the OS preference */ }
})();

<script>
"use strict";

// ---- Document manifest (ordered) ----
// Most pages are Markdown. Four are built from data instead — the two program
// galleries and the primitive index from their generated JSON, the playground
// from the WebAssembly build of the language — and carry a `kind` saying so.
const DOCS = [
  { id: "README",          file: "README.md",          title: "Overview",            desc: "Start here", group: "Introduction" },
  { id: "getting-started", file: "getting-started.md", title: "Getting started",     desc: "Install & first program", group: "Introduction" },
  { id: "walkthroughs",    file: "walkthroughs.md",    title: "Walkthroughs",        desc: "Features as whole programs", group: "Introduction" },
  { id: "playground",      kind: "playground",         title: "Playground",          desc: "Run Domain in the browser", group: "Introduction" },

// docs/render_test.go. Pull its functions into this scope under the names the
// rest of the page already uses.
const {
  escapeHtml, slugify, shortSlug, renderInline, makeLink, renderMarkdown,
  renderList, highlightDomain, buildSearchEntries, searchEntries, makeSnippet,
  renderGallery, renderPrimitiveIndex, programSlug,
  buildGalleryEntries, buildPrimitiveEntries,

DomainRender.setDocIndex(DOC_BY_ID);

// Fail loudly if render.js and this page have drifted apart. Every name above
// is used somewhere below, often inside a try/catch that would otherwise turn
// a missing export into a silently empty page — which is exactly how the
// search index broke once already.
for (const [name, fn] of Object.entries({
  escapeHtml, slugify, shortSlug, renderInline, makeLink, renderMarkdown,
  renderList, highlightDomain, buildSearchEntries, searchEntries, makeSnippet,
  renderGallery, renderPrimitiveIndex, programSlug,
  buildGalleryEntries, buildPrimitiveEntries,
})) {
  if (typeof fn !== "function") throw new Error(`render.js does not export ${name}()`);
}

// Every section of every page, built once at boot by loadAllForIndex. The
// entries are plain data produced by render.js; the array is the page's,
// which is what keeps the search code testable outside a browser.
let searchIndex = []; // { docId, docTitle, heading, headingSlug, text, lower }

// ============================================================
//  App / routing
// ============================================================
const contentEl = document.getElementById("content");
const docNavEl = document.getElementById("docNav");
const pageTocEl = document.getElementById("pageToc");
const pageNavEl = document.getElementById("pageNav");
const rawCache = {};
// The page currently displayed. Kept explicitly because the hash is not always
// a page — while the search dialog is open it holds the query instead.
let activeDocId = "README";
// The page whose content is currently in the DOM. Distinct from activeDocId,
// which is set before rendering: this is only assigned once a render finishes,
// so a failed load re-renders rather than being mistaken for a scroll.
let renderedDocId = null;

function renderNav(activeId) {
  let html = "";
  let lastGroup = null;
  for (const d of DOCS) {
    if (d.group !== lastGroup) { html += `<div class="group-label">${d.group}</div>`; lastGroup = d.group; }
    const cls = d.id === activeId ? "doc-link active" : "doc-link";
    html += `<a class="${cls}" href="#/${d.id}" data-route>${d.title}<span class="desc">${d.desc}</span></a>`;
  }
  docNavEl.innerHTML = html;
}

async function fetchDoc(doc) {
  if (rawCache[doc.id]) return rawCache[doc.id];
  const res = await fetch(doc.file, { cache: "no-cache" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  rawCache[doc.id] = text;
  return text;
}

// The two generated data files behind the gallery and the primitive index.
// Each is fetched once; a failure is cached as an empty list so a missing file
// degrades to an empty page rather than retrying on every navigation.
const jsonCache = {};
async function fetchJSON(file) {
  if (jsonCache[file]) return jsonCache[file];
  jsonCache[file] = (async () => {
    try {
      const res = await fetch(file, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } catch (e) {
      return [];
    }
  })();
  return jsonCache[file];
}
const fetchGallery = () => fetchJSON("gallery.json");
const fetchPrimitives = () => fetchJSON("primitives.json");

async function loadAllForIndex() {
  // Promise.all preserves order, so the index is assembled in manifest order
  // and equally-scored results always come back in the same order.
  const perDoc = await Promise.all(DOCS.map(async d => {
    try {
      // The generated pages are indexed from their data, so searching for
      // "fizzbuzz" or a primitive's signature finds them alongside the prose.
      if (d.kind === "gallery") {
        const all = await fetchGallery();
        return buildGalleryEntries(d.id, d.title, all.filter(p => p.group === d.galleryGroup));
      }
      if (d.kind === "primitives") {
        return buildPrimitiveEntries(d.id, d.title, await fetchPrimitives());
      }
      if (d.kind) return []; // the playground has no text to index
      return buildSearchEntries(d.id, d.title, await fetchDoc(d));
    } catch (e) {
      // A page that will not load is simply missing from the index — but say
      // so. Swallowing this silently is what let the whole index sit empty
      // without a single visible symptom.
      console.warn(`docs: could not index ${d.id}:`, e);
      return [];
    }
  }));
  searchIndex = perDoc.flat();
}

function renderPageToc(headings, docId) {
  if (headings.length < 2) { pageTocEl.innerHTML = ""; return; }
  let html = '<div class="label">On this page</div>';
  for (const h of headings) {
    if (h.level > 3) continue;
    // Entries are the heading text, which in the primitive reference carries
    // the full signature ("Map Each — List<T> × (T -> U) -> List<U>") and wrapped
    // to three lines each, making the column unscannable. The name before the
    // em dash is what someone scans for; the signature is one click away.
    const label = h.text.split("\u2014")[0].trim() || h.text;
    html += `<a class="${h.level === 3 ? "h3" : ""}" href="#/${docId}#${h.slug}" data-route data-slug="${h.slug}" title="${escapeHtml(h.text)}">${escapeHtml(label)}</a>`;
  }
  pageTocEl.innerHTML = html;
}

function renderPageNav(activeId) {
  const idx = DOCS.findIndex(d => d.id === activeId);
  const prev = DOCS[idx - 1], next = DOCS[idx + 1];
  let html = "";
  html += prev ? `<a class="prev" href="#/${prev.id}" data-route><span class="dir">← Previous</span><span class="ttl">${prev.title}</span></a>` : "<span></span>";
  html += next ? `<a class="next" href="#/${next.id}" data-route><span class="dir">Next →</span><span class="ttl">${next.title}</span></a>` : "<span></span>";
  pageNavEl.innerHTML = html;
}

async function route() {
  const hash = location.hash.replace(/^#\/?/, "");

  // #/search?q=… opens the dialog with a query already in it, so a search can
  // be linked to, bookmarked, or pasted into an issue. The page underneath is
  // left as it was.
  const searchRoute = hash.match(/^search\?q=(.*)$/);
  if (searchRoute) {
    let q = "";
    try { q = decodeURIComponent(searchRoute[1].replace(/\+/g, " ")); } catch (e) { q = searchRoute[1]; }
    openSearch(q);
    return;
  }

  // Format: docId or docId#anchor
  const hashParts = hash.split("#");
  let docId = hashParts[0] || "README";
  const anchor = hashParts[1] || "";
  if (!DOC_BY_ID[docId]) docId = "README";
  const doc = DOC_BY_ID[docId];
  activeDocId = docId;

  // Moving to another anchor on the page already displayed is a scroll, not a
  // navigation. Re-rendering would refetch and rebuild the whole document —
  // and would replace the very heading link the reader just clicked, which is
  // why its "copied" confirmation never survived long enough to be read.
  if (docId === renderedDocId) {
    scrollToAnchor(anchor);
    setupScrollSpy();
    return;
  }

  renderNav(docId);
  renderPageNav(docId);
  contentEl.innerHTML = '<div class="loading"><span class="spinner"></span>Loading…</div>';

  // Pages built from data rather than Markdown.
  if (doc.kind) {
    let rendered;
    if (doc.kind === "gallery") rendered = await renderGalleryPage(doc);
    else if (doc.kind === "primitives") rendered = await renderPrimitiveIndexPage(doc);
    else rendered = renderPlaygroundPage(doc);
    contentEl.innerHTML = renderDocBanner(docId) +
      `<article>${rendered.html.replace(/__DOCID__/g, docId)}</article>`;
    renderPageToc(rendered.headings || [], docId);
    if (rendered.afterRender) rendered.afterRender();
    renderedDocId = docId;
    scrollToAnchor(anchor);
    closeSidebar();
    setupScrollSpy();
    return;
  }

  let md;
  try {
    md = await fetchDoc(doc);
  } catch (e) {
    const isFile = location.protocol === "file:";
    contentEl.innerHTML = `<div class="error-box"><h2>Couldn't load ${escapeHtml(doc.file)}</h2>` +
      (isFile
        ? `<p>Browsers block <code>fetch()</code> of local files when you open this page directly from disk (<code>file://</code>).</p>
           <p>Serve it over HTTP instead. The simplest way is the built-in command, which serves this site (embedded in the binary) and opens it for you:</p>
           <pre><code>domain expansion: documentation
# then open  http://localhost:4444/  (use -p PORT to change the port)</code></pre>
           <p>Or serve the <code>docs/</code> folder yourself — from the folder run one of:</p>
           <pre><code>python3 -m http.server 8000    # then open http://localhost:8000/
npx serve                      # Node alternative</code></pre>`
        : `<p>Error: <code>${escapeHtml(e.message)}</code></p>`) +
      `</div>`;
    return;
  }

  const rendered = renderMarkdown(md);
  const htmlWithIds = rendered.html.replace(/__DOCID__/g, docId);
  const editUrl = REPO_EDIT_BASE + doc.file;
  const editLink = `<div class="page-edit"><a href="${editUrl}" target="_blank" rel="noopener">Edit this page on GitHub</a></div>`;
  contentEl.innerHTML = renderDocBanner(docId) + `<article>${htmlWithIds}${editLink}</article>`;
  renderPageToc(rendered.headings, docId);
  addRunButtons();
  renderedDocId = docId;
  scrollToAnchor(anchor);
  closeSidebar();
  setupScrollSpy();
}

// Give every Domain block on a rendered page a Run and an Explain button, once
// the playground is known to be available. Done here rather than in render.js
// so the renderer's output stays the same whether or not the wasm artifact was
// built — the buttons are a property of the page, not of the Markdown.
function addRunButtons() {
  if (!playgroundReady()) return;
  for (const pre of contentEl.querySelectorAll("pre")) {
    const tag = pre.querySelector(".lang-tag");
    if (!tag || tag.textContent !== "domain") continue;
    if (pre.querySelector("[data-run-block]")) continue;
    // Display-only blocks (marked `domain ignore` in the Markdown) are not
    // programs, and the doc tests skip them for the same reason.
    if (!/Reveal|Cursed|Maximum|Domain Expansion/.test(pre.textContent)) continue;
    pre.insertAdjacentHTML("beforeend",
      `<button class="explain-btn" type="button" data-run-block data-explain>Explain</button>` +
      `<button class="run-btn" type="button" data-run-block>Run</button>`);
  }
}

// Scroll to the requested anchor, or to the top when there isn't one.
function scrollToAnchor(anchor) {
  requestAnimationFrame(() => {
    if (anchor) {
      const target = document.getElementById(anchor);
      if (target) { target.scrollIntoView(); return; }
    }
    window.scrollTo(0, 0);
    document.querySelector("main").scrollIntoView({ block: "start" });
  });
}

async function renderGalleryPage(doc) {
  const [all] = await Promise.all([fetchGallery(), probePlayground()]);
  const programs = all.filter(p => p.group === doc.galleryGroup);
  if (!programs.length) {
    return { html: `<h1>${escapeHtml(doc.title)}</h1><div class="error-box">` +
      `<p>Couldn't load <code>gallery.json</code>, so there is nothing to show here.</p>` +
      `<p>It is generated from the repository: <code>go test ./docs -update</code>.</p></div>`, headings: [] };
  }
  const intro = doc.galleryGroup === "examples"
    ? `<p>Nineteen small, self-contained programs. Each one is run against its own input in both optimizer modes and checked against the exact output below, so none of them can quietly rot.</p>`
    : `<p>Thirteen classic programming problems — FizzBuzz through Game of Life — written as pipelines. Same golden testing as the examples.</p>`;
  const rendered = renderGallery(programs, { runnable: playgroundReady() });
  return {
    html: `<h1>${escapeHtml(doc.title)}</h1>${intro}${rendered.html}`,
    headings: rendered.headings,
  };
}

async function renderPrimitiveIndexPage(doc) {
  const entries = await fetchPrimitives();
  if (!entries.length) {
    return { html: `<h1>${escapeHtml(doc.title)}</h1><div class="error-box">` +
      `<p>Couldn't load <code>primitives.json</code>.</p>` +
      `<p>It is generated from the primitive catalog: <code>go test ./docs -update</code>.</p></div>`, headings: [] };
  }
  const body = renderPrimitiveIndex(entries, "");
  const html = `<h1>${escapeHtml(doc.title)}</h1>` +
    `<p>Every primitive in the vocabulary, grouped by the themed keyword that decides where in a pipeline it can appear. ` +
    `Filter by name, type or description; each one links into the <a href="#/primitives" data-route>full reference</a>.</p>` +
    `<div class="prim-filter"><input type="text" id="primFilter" placeholder="Filter ${entries.length} primitives — try “grid”, “List&lt;Int&gt;”, “sort”…" aria-label="Filter primitives" autocomplete="off"></div>` +
    `<p class="prim-count" id="primCount" aria-live="polite">${entries.length} primitives</p>` +
    `<div id="primBody">${body.html}</div>`;
  return {
    html, headings: body.headings,
    // Filtering re-renders the table in place; the right-rail TOC is left
    // alone, since a filter that empties it would leave the reader with no
    // way back to the full list.
    afterRender: () => {
      const input = document.getElementById("primFilter");
      const bodyEl = document.getElementById("primBody");
      const countEl = document.getElementById("primCount");
      if (!input || !bodyEl) return;
      input.addEventListener("input", () => {
        const out = renderPrimitiveIndex(entries, input.value);
        bodyEl.innerHTML = out.html.replace(/__DOCID__/g, doc.id);
        countEl.textContent = input.value.trim()
          ? `${out.shown} of ${entries.length} primitives`
          : `${entries.length} primitives`;
      });
    },
  };
}

// Scroll spy for right-rail TOC
let scrollSpyHandler = null;
function setupScrollSpy() {
  if (scrollSpyHandler) window.removeEventListener("scroll", scrollSpyHandler);
  const links = [...pageTocEl.querySelectorAll("a")];
  if (!links.length) return;
  const targets = links.map(a => ({ a, el: document.getElementById(a.dataset.slug) })).filter(t => t.el);
  scrollSpyHandler = () => {
    let current = null;
    for (const t of targets) {
      if (t.el.getBoundingClientRect().top <= 120) current = t;
    }
    links.forEach(a => a.classList.remove("active"));
    if (current) current.a.classList.add("active");
  };
  window.addEventListener("scroll", scrollSpyHandler, { passive: true });
  scrollSpyHandler();
}

// ============================================================
//  Playground — the language compiled to WebAssembly
// ============================================================
// The whole front end (lexer, parser, resolver, optimizer, interpreter) is
// pure Go with no dependencies, so it compiles to js/wasm unchanged and runs
// the reader's program in the browser rather than on a server. That choice is
// what makes Run safe to offer at all: there is no filesystem to read, so
// `Cursed Energy: input.txt` falls through to the input box exactly as it
// falls through to stdin on a terminal, and a runaway program is killed by
// terminating the worker — something a server-side runner cannot do to a
// goroutine.
//
// The artifact is built separately (docs/wasm/build.sh) and is not committed,
// so the site has to work without it: everything below degrades to a note
// explaining how to build it, and the Run buttons simply do not appear.
const WASM_URL = "wasm/domain.wasm";
const PLAYGROUND_TIMEOUT_MS = 5000;

const playground = {
  state: "unknown",   // unknown | loading | ready | absent
  worker: null,
  seq: 0,
  pending: new Map(),
};

function playgroundReady() { return playground.state === "ready"; }

// probePlayground checks for the artifact once, without downloading five
// megabytes of it: a one-byte range request is enough to know whether the Run
// buttons should be offered at all. (A HEAD would do the same, but Chromium
// aborts the body it is never sent and logs a failed request for it, which
// looks like a broken site to anyone with devtools open.)
async function probePlayground() {
  if (playground.state !== "unknown") return playground.state;
  playground.state = "loading";
  try {
    const res = await fetch(WASM_URL, { headers: { Range: "bytes=0-0" }, cache: "no-cache" });
    // 206 for a server that honours the range, 200 for one that ignores it.
    playground.state = res.ok ? "ready" : "absent";
    // Read the byte rather than cancelling: an abandoned body is itself
    // reported as a failed request. A server that ignored the range would
    // hand back the whole module, so only drain the partial response.
    if (res.status === 206) await res.arrayBuffer();
    else if (res.body && res.body.cancel) res.body.cancel();
  } catch (e) {
    playground.state = "absent";
  }
  return playground.state;
}

// startWorker boots the runner. Each run gets its own worker so a timeout can
// terminate it outright — the only reliable way to stop a Go program that has
// stopped cooperating.
function startWorker() {
  if (playground.worker) return playground.worker;
  const w = new Worker("wasm/runner.js");
  w.onmessage = e => {
    const { id, ok, result, error } = e.data || {};
    const entry = playground.pending.get(id);
    if (!entry) return;
    playground.pending.delete(id);
    clearTimeout(entry.timer);
    ok ? entry.resolve(result) : entry.reject(new Error(error || "run failed"));
  };
  w.onerror = e => {
    for (const [, entry] of playground.pending) {
      clearTimeout(entry.timer);
      entry.reject(new Error(e.message || "the playground worker failed to start"));
    }
    playground.pending.clear();
    killWorker();
  };
  playground.worker = w;
  return w;
}

function killWorker() {
  if (playground.worker) { playground.worker.terminate(); playground.worker = null; }
}

// runProgram sends one program to the worker and resolves with
// { output, explain, error }. On timeout the worker is terminated, so an
// infinite loop costs one worker rather than the tab.
function runProgram(source, input, opts) {
  const libs = (opts && opts.libs) || {};
  const w = startWorker();
  const id = ++playground.seq;
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      playground.pending.delete(id);
      killWorker();
      reject(new Error(`timed out after ${PLAYGROUND_TIMEOUT_MS / 1000}s — the program was stopped`));
    }, PLAYGROUND_TIMEOUT_MS);
    playground.pending.set(id, { resolve, reject, timer });
    w.postMessage({ id, source, input, libs, explain: !!(opts && opts.explain), optimize: !(opts && opts.optimize === false) });
  });
}

// The note shown wherever Run would be, when the artifact was never built.
function playgroundMissingNote() {
  return `<div class="pg-unavailable"><strong>The playground isn't built.</strong> ` +
    `It is a separate WebAssembly artifact, not committed to the repository. Build it with:` +
    `<pre><code>./docs/wasm/build.sh</code></pre>` +
    `then reload this page. Everything else on the site works without it.</div>`;
}

// The thesis of the language in seven lines: a named algorithm is a request,
// and Explain shows the optimizer answering it with a different one.
const PLAYGROUND_STARTER = `Cursed Energy: input.txt
Cursed Technique: Split Text by "\\n\\n"
Cursed Technique: Split Each by "\\n"
Channeled Energy: Convert Each List to Integers
Maximum Technique: Sum Each Group
Domain Expansion: Quicksort, Descending
Maximum Technique: Select Top 3, Sum
Reveal: stdout`;
const PLAYGROUND_STARTER_INPUT = "1000\n2000\n3000\n\n4000\n\n5000\n6000\n\n7000\n8000\n9000\n\n10000";

function renderPlaygroundPage(doc) {
  const html = `<h1>${escapeHtml(doc.title)}</h1>` +
    `<p>The language runs here, in this tab — the same lexer, parser, resolver, optimizer and interpreter the ` +
    `<code>domain</code> binary uses, compiled to WebAssembly. Nothing is sent anywhere.</p>` +
    `<p><code>Cursed Energy: input.txt</code> reads the input box: on a terminal a missing input file falls back to stdin, ` +
    `and in the browser there is no filesystem at all, so every program falls back the same way.</p>` +
    `<div id="pgHost"></div>`;
  return {
    html, headings: [],
    afterRender: async () => {
      const host = document.getElementById("pgHost");
      if (!host) return;
      if (await probePlayground() !== "ready") { host.innerHTML = playgroundMissingNote(); return; }
      host.innerHTML =
        `<div class="pg-grid">
          <div class="pg-pane">
            <label for="pgSource">Program</label>
            <textarea id="pgSource" spellcheck="false" autocomplete="off"></textarea>
          </div>
          <div class="pg-pane">
            <label for="pgInput">Input</label>
            <textarea id="pgInput" class="pg-input" spellcheck="false" autocomplete="off"></textarea>
          </div>
        </div>
        <div class="pg-bar">
          <button class="pg-run" type="button" id="pgRun">Run</button>
          <button class="pg-secondary" type="button" id="pgExplain">Explain</button>
          <select class="pg-secondary" id="pgLoad" aria-label="Load a program">
            <option value="">Load a program…</option>
          </select>
          <span class="pg-status" id="pgStatus"></span>
        </div>
        <div id="pgOut"></div>`;
      const srcEl = document.getElementById("pgSource");
      const inEl = document.getElementById("pgInput");
      srcEl.value = PLAYGROUND_STARTER;
      inEl.value = PLAYGROUND_STARTER_INPUT;

      // Every gallery program is loadable, so the playground doubles as the
      // place to take one apart.
      const sel = document.getElementById("pgLoad");
      fetchGallery().then(all => {
        for (const p of all) {
          const opt = document.createElement("option");
          opt.value = p.id;
          opt.textContent = `${p.group}/${p.id}`;
          sel.appendChild(opt);
        }
        sel.addEventListener("change", async () => {
          const prog = (await fetchGallery()).find(p => p.id === sel.value);
          if (!prog) return;
          srcEl.value = prog.source;
          inEl.value = prog.input;
          document.getElementById("pgOut").innerHTML = "";
        });
      });

      const go = explain => runInto(document.getElementById("pgOut"), srcEl.value, inEl.value,
        { explain }, document.getElementById("pgStatus"));
      document.getElementById("pgRun").addEventListener("click", () => go(false));
      document.getElementById("pgExplain").addEventListener("click", () => go(true));
      // Ctrl/Cmd+Enter runs, the shortcut every editor-shaped box should have.
      for (const el of [srcEl, inEl]) {
        el.addEventListener("keydown", e => {
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); go(false); }
        });
      }
    },
  };
}

// runInto executes a program and renders the result into `host`. Shared by the
// playground page, the gallery cards and the Run buttons on code blocks.
async function runInto(host, source, input, opts, statusEl) {
  if (!host) return;
  const setStatus = t => { if (statusEl) statusEl.textContent = t; };
  host.innerHTML = `<div class="run-output"><div class="ro-head"><span class="spinner"></span>Running…</div></div>`;
  setStatus("running…");
  const started = performance.now();
  try {
    const res = await runProgram(source, input, opts);
    const ms = Math.round(performance.now() - started);
    setStatus(`${ms} ms`);
    const failed = !!res.error;
    let body = "";
    if (res.explain && res.explain.length) {
      body += `<pre class="ro-explain"><code>${escapeHtml(res.explain.join("\n"))}</code></pre>`;
    }
    body += `<pre><code>${escapeHtml(failed ? res.error : (res.output || "(no output)"))}</code></pre>`;
    host.innerHTML = `<div class="run-output${failed ? " is-error" : ""}">` +
      `<div class="ro-head">${failed ? "Error" : "Output"}` +
      `<button class="ro-close" type="button" data-close-output aria-label="Dismiss output">✕</button></div>` +
      body + `</div>`;
  } catch (e) {
    setStatus("");
    host.innerHTML = `<div class="run-output is-error"><div class="ro-head">Error` +
      `<button class="ro-close" type="button" data-close-output aria-label="Dismiss output">✕</button></div>` +
      `<pre><code>${escapeHtml(e.message)}</code></pre></div>`;
  }
}

// Dismissing a result, and the Run buttons that appear on gallery cards and on
// runnable code blocks — delegated, so blocks rendered after navigation work.
document.addEventListener("click", async e => {
  const close = e.target.closest("[data-close-output]");
  if (close) { const box = close.closest(".run-output"); if (box) box.remove(); return; }

  const galleryRun = e.target.closest("[data-run-program]");
  if (galleryRun) {
    const id = galleryRun.getAttribute("data-run-program");
    const prog = (await fetchGallery()).find(p => p.id === id);
    if (!prog) return;
    let out = galleryRun.closest("section.program").querySelector(".run-host");
    if (!out) {
      out = document.createElement("div");
      out.className = "run-host";
      galleryRun.closest("section.program").appendChild(out);
    }
    runInto(out, prog.source, prog.input, { libs: prog.libs });
    return;
  }

  const blockRun = e.target.closest("[data-run-block]");
  if (blockRun) {
    const pre = blockRun.closest("pre");
    const code = pre && pre.querySelector("code");
    if (!code) return;
    let out = pre.nextElementSibling;
    if (!out || !out.classList.contains("run-host")) {
      out = document.createElement("div");
      out.className = "run-host";
      pre.after(out);
    }
    runInto(out, code.innerText, "", { explain: blockRun.hasAttribute("data-explain") });
  }
});

// ============================================================
//  Search UI
// ============================================================
const overlay = document.getElementById("searchOverlay");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
const searchStatus = document.getElementById("searchStatus");
const scopeBtn = document.getElementById("scopeBtn");
let selIndex = 0;
let indexReady = false;
let scopedToPage = false;
// What the reader was on before the dialog took focus, so closing it puts them
// back rather than at the top of the document.
let focusBeforeSearch = null;

// ---- Recent searches ----------------------------------------------------
// Kept locally, so a query you ran yesterday is one click away. Private-mode
// storage failures are ignored: the feature is a convenience, not a dependency.
const RECENTS_KEY = "domain-docs-recent-searches";
const MAX_RECENTS = 6;
function readRecents() {
  try {
    const raw = JSON.parse(localStorage.getItem(RECENTS_KEY) || "[]");
    return Array.isArray(raw) ? raw.filter(s => typeof s === "string").slice(0, MAX_RECENTS) : [];
  } catch (e) { return []; }
}
function rememberSearch(q) {
  q = q.trim();
  if (q.length < 2) return;
  const next = [q, ...readRecents().filter(s => s !== q)].slice(0, MAX_RECENTS);
  try { localStorage.setItem(RECENTS_KEY, JSON.stringify(next)); } catch (e) { /* private mode */ }
}
function recentsMarkup() {
  const recents = readRecents();
  if (!recents.length) {
    return '<div class="empty">Start typing to search titles, headings, and full text.</div>';
  }
  return `<div class="search-recents"><div class="rec-label">Recent</div>` +
    recents.map(q => `<button type="button" data-recent="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join("") +
    `</div>`;
}

// ---- Opening and closing ------------------------------------------------
function openSearch(initial) {
  focusBeforeSearch = document.activeElement;
  overlay.classList.add("open");
  if (typeof initial === "string") searchInput.value = initial;
  searchInput.focus();
  searchInput.select();
  renderResults(searchInput.value);
  syncSearchHash(searchInput.value);
}
function closeSearch() {
  if (!overlay.classList.contains("open")) return;
  overlay.classList.remove("open");
  searchInput.setAttribute("aria-expanded", "false");
  // Returning focus is the half of a dialog that is easy to forget and
  // impossible to work around with a keyboard.
  if (focusBeforeSearch && typeof focusBeforeSearch.focus === "function") focusBeforeSearch.focus();
  focusBeforeSearch = null;
  // A deep-linked search leaves #/search?q=… in the address bar; put the page
  // back so Back does not reopen the dialog and a reload lands where the
  // reader actually is.
  if (location.hash.startsWith("#/search")) replaceHash(pageHash());
}

// The page the reader is on, for the "This page" scope filter. It is tracked
// rather than read back out of the hash, because while the dialog is open the
// hash is the search itself — parsing it would scope every search to README.
function currentDocId() { return DOC_BY_ID[activeDocId] ? activeDocId : "README"; }

// Reflect the query in the address bar as it is typed, so the URL can be
// copied and shared. replaceState rather than assignment: this must not fire
// the router or leave a history entry per keystroke.
function syncSearchHash(q) {
  if (!overlay.classList.contains("open")) return;
  replaceHash(q.trim() ? `#/search?q=${encodeURIComponent(q)}` : pageHash());
}

// The hash for the page behind the dialog. Closing the search, or clearing the
// query, restores this rather than dropping the hash altogether — stripping it
// would silently move the reader back to the overview on the next reload.
function pageHash() { return `#/${currentDocId()}`; }

function replaceHash(target) {
  try {
    history.replaceState(null, "", target);
  } catch (e) { /* some sandboxes forbid replaceState; the dialog still works */ }
}

function renderResults(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const setStatus = t => { if (searchStatus) searchStatus.textContent = t; };
  searchInput.setAttribute("aria-expanded", terms.length ? "true" : "false");
  searchInput.removeAttribute("aria-activedescendant");
  if (!terms.length) {
    searchResults.innerHTML = recentsMarkup();
    setStatus("");
    return;
  }
  if (!indexReady) {
    searchResults.innerHTML = '<div class="empty"><span class="spinner"></span>Building search index…</div>';
    setStatus("Building the search index.");
    return;
  }
  const scope = scopedToPage ? currentDocId() : null;
  const pool = scope ? searchIndex.filter(e => e.docId === scope) : searchIndex;
  const results = searchEntries(pool, q);
  selIndex = 0;
  if (!results.length) {
    const where = scope ? ` on ${DOC_BY_ID[scope].title}` : "";
    searchResults.innerHTML = `<div class="empty">No matches for “${escapeHtml(q)}”${escapeHtml(where)}.</div>`;
    setStatus(`No results for ${q}${where}.`);
    return;
  }
  searchResults.innerHTML = results.map((r, i) => {
    const e = r.entry;
    const href = `#/${e.docId}${e.headingSlug ? "#" + e.headingSlug : ""}`;
    return `<a class="result ${i === 0 ? "sel" : ""}" href="${href}" id="search-result-${i}"
      role="option" aria-selected="${i === 0}" data-search-result data-idx="${i}">
      <div class="r-doc">${escapeHtml(e.docTitle)}</div>
      <div class="r-title">${escapeHtml(e.heading)}</div>
      <div class="r-snippet">${makeSnippet(e, terms)}</div>
    </a>`;
  }).join("");
  searchInput.setAttribute("aria-activedescendant", "search-result-0");
  setStatus(`${results.length} result${results.length === 1 ? "" : "s"} for ${q}.`);
}

function moveSelection(delta) {
  const items = [...searchResults.querySelectorAll(".result")];
  if (!items.length) return;
  items[selIndex]?.classList.remove("sel");
  items[selIndex]?.setAttribute("aria-selected", "false");
  selIndex = (selIndex + delta + items.length) % items.length;
  items[selIndex].classList.add("sel");
  items[selIndex].setAttribute("aria-selected", "true");
  items[selIndex].scrollIntoView({ block: "nearest" });
  // Arrow keys move a class; without this the announcement never follows.
  searchInput.setAttribute("aria-activedescendant", items[selIndex].id);
}

function openResult(href) {
  rememberSearch(searchInput.value);
  closeSearch();
  location.hash = href.slice(1);
}

function openSelected() {
  const el = searchResults.querySelectorAll(".result")[selIndex];
  if (el) openResult(el.getAttribute("href"));
}

searchInput.addEventListener("input", e => { renderResults(e.target.value); syncSearchHash(e.target.value); });
searchResults.addEventListener("click", e => {
  const recent = e.target.closest("[data-recent]");
  if (recent) {
    searchInput.value = recent.getAttribute("data-recent");
    searchInput.focus();
    renderResults(searchInput.value);
    return;
  }
  const a = e.target.closest("[data-search-result]");
  if (a) { e.preventDefault(); openResult(a.getAttribute("href")); }
});
searchInput.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveSelection(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSelection(-1); }
  else if (e.key === "Enter") { e.preventDefault(); openSelected(); }
  else if (e.key === "Escape") { closeSearch(); }
});
// A modal dialog owns the Tab key: without this, tabbing walks out of the
// panel into the page behind it, which is still there and still scrollable.
overlay.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const focusable = [searchInput, scopeBtn].filter(el => el && el.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
scopeBtn.addEventListener("click", () => {
  scopedToPage = !scopedToPage;
  scopeBtn.setAttribute("aria-pressed", String(scopedToPage));
  scopeBtn.textContent = scopedToPage ? `On ${DOC_BY_ID[currentDocId()].title}` : "This page";
  renderResults(searchInput.value);
  searchInput.focus();
});
overlay.addEventListener("click", e => { if (e.target === overlay) closeSearch(); });
document.getElementById("sidebarSearch").addEventListener("focus", () => openSearch());
document.getElementById("sidebarSearch").addEventListener("click", () => openSearch());

// Global keyboard shortcuts
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if ((e.key === "/" && !typing) ) { e.preventDefault(); openSearch(); }
  else if ((e.key === "k" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); openSearch(); }
  else if (e.key === "Escape" && overlay.classList.contains("open")) { closeSearch(); }
});

// ============================================================
//  Sidebar (mobile)
// ============================================================
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
document.getElementById("menuToggle").addEventListener("click", () => {
  sidebar.classList.toggle("open"); scrim.classList.toggle("show");
});
function closeSidebar() { sidebar.classList.remove("open"); scrim.classList.remove("show"); }
scrim.addEventListener("click", closeSidebar);

// Intercept in-app links so they use the hash router without full reload jank
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-route]");
  if (a) { /* hash navigation handled by browser + hashchange */ closeSidebar(); }
});

window.addEventListener("hashchange", route);

// ---- Boot ----
// ---- Theme -------------------------------------------------------------
// The OS preference is the default; an explicit choice overrides it in either
// direction and is remembered. Applied before first paint (see the inline
// bootstrap in <head>) so a dark-theme reader never gets a white flash.
const THEME_KEY = "domain-docs-theme";
function currentTheme() {
  const set = document.documentElement.getAttribute("data-theme");
  if (set) return set;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* private mode */ }
  const btn = document.getElementById("theme-toggle");
  if (btn) {
    btn.textContent = t === "dark" ? "☀" : "☾";
    btn.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
    btn.setAttribute("title", btn.getAttribute("aria-label"));
  }
}
document.addEventListener("click", e => {
  if (e.target.closest("#theme-toggle")) applyTheme(currentTheme() === "dark" ? "light" : "dark");
});

// ---- Heading links -----------------------------------------------------
// The ¶ beside a heading was a plain link: clicking it jumped there, and
// getting a shareable URL meant copying from the address bar afterwards.
// Clicking now puts the absolute link on the clipboard and navigates, which is
// what people were doing by hand. Modifier-clicks and middle-clicks are left
// to the browser so "open in new tab" still works.
document.addEventListener("click", async e => {
  const anchor = e.target.closest("a.heading-anchor");
  if (!anchor || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
  const href = anchor.getAttribute("href") || "";
  const absolute = location.origin + location.pathname + location.search + href;
  try {
    await navigator.clipboard.writeText(absolute);
    const was = anchor.textContent;
    anchor.textContent = "copied";
    anchor.style.opacity = "1";
    setTimeout(() => { anchor.textContent = was; anchor.style.opacity = ""; }, 1200);
  } catch (err) {
    // Clipboard access can be refused (no permission, insecure origin). The
    // link still works, which is the behaviour this replaced.
  }
});

// ---- Copy buttons ------------------------------------------------------
// Delegated, so blocks rendered after navigation are covered without rebinding.
document.addEventListener("click", async e => {
  const btn = e.target.closest("button[data-copy]");
  if (!btn) return;
  const code = btn.parentElement.querySelector("code");
  if (!code) return;
  try {
    await navigator.clipboard.writeText(code.innerText);
    btn.textContent = "Copied";
  } catch (err) {
    btn.textContent = "Press ⌘C";
  }
  btn.classList.add("copied");
  setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1400);
});

// ---- Build stamp -------------------------------------------------------
// The documentation is embedded in the binary, so when the binary is serving
// it the two are necessarily the same build — worth stating on a site whose
// discipline is that the reference describes the code that exists. Served
// statically there is nothing to report, and the panel stays hidden.
async function showBuildStamp() {
  const el = document.getElementById("buildStamp");
  if (!el) return;
  let info;
  try {
    const res = await fetch("build.json", { cache: "no-store" });
    if (!res.ok) return;
    info = await res.json();
  } catch (e) { return; }
  if (!info || !info.version) return;

  const short = info.revision ? info.revision.slice(0, 12) : "";
  // Go appends "+dirty" to the pseudo-version of a modified tree; the badge
  // below says the same thing more legibly, so it is not printed twice.
  const version = info.version.replace(/\+dirty$/, "");
  let html = `Serving from <code>${escapeHtml(version)}</code>`;
  if (short) {
    html += `<br>commit <code>${escapeHtml(short)}</code>`;
    if (info.modified) html += ` <span class="dirty" title="built from a working tree with uncommitted changes">+dirty</span>`;
  }
  if (info.time) html += `<br>${escapeHtml(info.time.slice(0, 10))}`;
  if (info.go) html += ` · ${escapeHtml(info.go)}`;
  el.innerHTML = html;
  el.hidden = false;
}

(async function boot() {
  applyTheme(currentTheme());
  showBuildStamp();
  // Whether the playground was built decides whether Run buttons appear, so
  // settle it before the first page renders.
  await probePlayground();
  route();
  await loadAllForIndex();
  indexReady = true;
  if (overlay.classList.contains("open")) renderResults(searchInput.value);
})();
</script>
